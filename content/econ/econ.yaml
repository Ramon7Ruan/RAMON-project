- id: econ.micro.opportunity-cost
  domain: econ
  track: micro
  title: 机会成本
  one_liner: 这笔钱没花出去，也有成本吗？
  key_points:
    - 成本是放弃的最好选项，不是账面支出
    - 沉没成本不该进入当下决策
  difficulty: 1
  tags: [成本, 决策]
  order: 17
  updated_at: 2026-09-21
  recipe: [prose, curve, compare, case, scale]
  blocks:
    - {type: prose, label: 定义, body: "机会成本是**为了做这件事而放弃的最好选择**。它常常不出现在任何账单上，却是决策真正的成本；而已经花掉、无法收回的**沉没成本**不该影响下一步。"}
    - type: compare
      label: 三种成本的区分
      columns: ["", 会计成本, 机会成本, 沉没成本]
      rows:
        - [是否记账, 记, 不记, 记]
        - [决策相关性, 部分相关, 强相关, 不相关]
        - [例子, 支付的租金, 放弃的存款利息, 已投入的调研费]
    - type: case
      label: 微案例
      title: 要不要继续这个项目
      nums: [{label: 已投入, v: 200 万}, {label: 未来还需投入, v: 300 万}, {label: 预计回收, v: 250 万}]
      body: 已投入的 200 万是沉没成本。只看未来：再投 300 万、回收 250 万，冷静的答案是不继续。
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0", t: "几乎无更好选项"}
        - {v: "中等", t: "有明显的次优选择"}
        - {v: "很高", t: "放弃的是最好的那条路"}
    - type: curve
      label: 生产可能性边界
      xLabel: 产品 A 产量
      yLabel: 产品 B 产量
      xDomain: [0, 10]
      yDomain: [0, 10]
      note: 边界上的每一点都是有效的；多生产 A 的机会成本就是放弃的 B。
      series:
        - {name: 可能性边界, points: [[0.5, 9.7], [2, 9], [4, 7.7], [6, 6], [8, 3.6], [9.7, 0.5]]}
  links:
    - {to: econ.micro.externality, reason: 延伸：未被计入的成本还有一类}
    - {to: econ.econometrics.endogeneity, reason: 对比：什么才叫"真实的原因"}

