# 经济学 24 个概念（宏观 10 / 微观 8 / 计量 6）
# 差异化约束：本区每个概念必须包含 curve 或 flow（机制与均衡直觉）

# ============================ 宏观经济 ============================

- id: econ.macro.monetary-transmission
  domain: econ
  track: macro
  title: 货币政策传导机制
  one_liner: 央行降息，为什么企业不一定马上借钱？
  key_points:
    - 三道关：银行负债端、信贷定价、企业预期
    - 漏损多发生在最后一关，取决于预期而非利率
  difficulty: 2
  tags: [利率, 政策, 机制]
  order: 1
  updated_at: 2026-09-21
  recipe: [prose, flow, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "央行降息只是把资金的**批发价**压低。要变成企业账上的**零售价**，中间要过三道关，每一道都可能漏损。"}
    - type: flow
      label: 传导链路
      steps:
        - {label: 政策利率下调, note: 7 天逆回购}
        - {label: 银行资金成本, note: 负债端传导}
        - {label: 贷款利率, note: LPR 报价调整}
        - {label: 企业投资意愿, note: 取决于预期回报}
    - type: case
      label: 微案例
      title: LPR 连续下调之后
      nums: [{label: 1 年期 LPR 累计下调, v: 20bp}, {label: 企业中长期贷款增速, v: 回落}]
      body: 利率降了，企业中长期贷款却没有同步放量，说明卡点在链条后半段——预期，而不是资金价格。
    - {type: pitfall, label: 误区, wrong: 降息一定会刺激企业投资。, right: 只有预期回报率高于贷款利率时企业才会借钱。, why: 传导链条的后半段取决于预期，不是资金价格本身。}
  links:
    - {to: econ.macro.liquidity-trap, reason: 对比：传到不动时的极端情形}
    - {to: econ.macro.money-multiplier, reason: 前置：银行体系如何创造存款}
    - {to: hotspot.event.pboc-lpr-2026, reason: 案例：传导链条上的一次实际漏损}

- id: econ.macro.liquidity-trap
  domain: econ
  track: macro
  title: 流动性陷阱
  one_liner: 利率降到接近零之后，货币政策还剩下什么？
  key_points:
    - 利率接近零时，货币需求曲线趋于垂直
    - 钱没进信贷循环，就不会变成通胀
  difficulty: 3
  tags: [利率, 货币政策]
  order: 2
  updated_at: 2026-09-21
  recipe: [prose, curve, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "当利率已经接近零，人们预期未来利率只会升、债券只会跌，于是宁可不买债券也要持有现金。此时**货币需求曲线变成垂直的**，投放再多流动性也压不动利率。"}
    - type: curve
      label: 货币需求与利率
      xLabel: 货币供给 M
      yLabel: 利率 r
      xDomain: [0, 10]
      yDomain: [0, 10]
      note: 虚线为陷阱区间——曲线趋于垂直，M 增加而 r 几乎不动。
      series:
        - {name: 常规区间, points: [[1, 8.4], [2, 6.6], [3, 5.2], [4.2, 4.1], [5.5, 3.3]]}
        - {name: 陷阱区间, points: [[5.5, 3.3], [6.6, 2.5], [7.4, 1.7], [8.2, 0.9], [9.2, 0.4], [10, 0.2]], dash: 5}
    - type: case
      label: 微案例
      title: 日本的二十年
      nums: [{label: 政策利率, v: 约 0%}, {label: 持续时长, v: 20 年以上}]
      body: 基础货币大幅扩张，但信贷与物价长期低迷，政策工具从利率转向量化宽松与收益率曲线控制。
    - {type: pitfall, label: 误区, wrong: 央行印钱必然带来通货膨胀。, right: 若新增货币没有进入信贷与支出循环，它会沉淀为超额准备金。, why: 通胀的触发条件是货币进入实体支出，而非货币总量增加。}
  links:
    - {to: econ.macro.monetary-transmission, reason: 前置：正常情况下的传导链条}
    - {to: econ.macro.inflation-expectation, reason: 延伸：预期如何决定通胀}

- id: econ.macro.phillips-curve
  domain: econ
  track: macro
  title: 菲利普斯曲线
  one_liner: 通胀和失业之间，真的存在稳定的取舍吗？
  key_points:
    - 短期确实存在通胀与失业的取舍
    - 长期曲线垂直，取舍消失
  difficulty: 2
  tags: [通胀, 失业]
  order: 3
  updated_at: 2026-09-21
  recipe: [prose, curve, timeline, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "最初的菲利普斯曲线是一条**稳定的负相关曲线**：失业低时通胀高。1970 年代的**滞胀**打破了这个关系——曲线整体右移，于是有了「附加预期的菲利普斯曲线」。"}
    - type: curve
      label: 短期与长期
      xLabel: 失业率 u
      yLabel: 通胀率
      xDomain: [0, 10]
      yDomain: [0, 10]
      note: 短期可沿曲线取舍；长期是垂直线，取舍消失。
      series:
        - {name: 短期，预期通胀 2%, points: [[1.2, 8.6], [2.6, 6.4], [4.2, 4.6], [6, 3.1], [8, 2.1]]}
        - {name: 长期，自然失业率, points: [[5.6, 0.6], [5.6, 9.4]], dash: 5}
    - type: timeline
      label: 认知演变
      events:
        - {date: "1958", title: Phillips 提出负相关关系, note: 基于英国近百年工资与失业数据。}
        - {date: "1968", title: Friedman 与 Phelps 引入预期, note: 指出长期不存在这种取舍。}
        - {date: "1970s", title: 滞胀出现, note: 曲线右移，原版模型失效。, hot: true}
        - {date: "1980s 后", title: 附加预期版本成为主流, note: 短期有取舍，长期回到自然失业率。}
    - {type: pitfall, label: 误区, wrong: 可以用高通胀长期换取低失业。, right: 只可能短期换取，代价是通胀预期上移后取舍彻底消失。, why: 预期会适应。一旦工人和企业把高通胀计入定价，实际购买力被抵消。}
  links:
    - {to: econ.macro.inflation-expectation, reason: 延伸：预期为什么决定了这条曲线的位置}
    - {to: econ.macro.liquidity-trap, reason: 对比：极端货币环境下的政策困境}
    - {to: hotspot.event.euro-area-energy, reason: 案例：供给冲击推动曲线整体上移}

- id: econ.macro.cpi-vs-core
  domain: econ
  track: macro
  title: CPI 与核心 CPI
  one_liner: 整体通胀 3%，为什么央行更盯着核心通胀？
  key_points:
    - 核心 CPI 剔除食品与能源的短期波动
    - 看趋势用核心，看生活成本用整体
  difficulty: 1
  tags: [通胀, 数据]
  order: 4
  updated_at: 2026-09-21
  recipe: [prose, dataviz, compare, flow, case]
  blocks:
    - {type: prose, label: 定义, body: "整体 CPI 里，食品与能源的波动**又大又快**。核心 CPI 把它们剔掉，用来观察**通胀的趋势**——因为货币政策影响不了油价，但能影响趋势。"}
    - type: dataviz
      label: 两类指标的差异
      chart: line
      xLabel: 月份
      yLabel: 同比 %
      xTicks: [1, 2, 3, 4, 5, 6, 7, 8]
      series:
        - {name: 整体 CPI, points: [2.1, 4.8, 3.2, 2.6, 1.9, 3.4, 2.2, 2.8]}
        - {name: 核心 CPI, points: [2.0, 2.3, 2.4, 2.5, 2.4, 2.6, 2.5, 2.5]}
      source: 示意数据，仅用于说明波动差异
    - type: compare
      label: 两个口径怎么选
      columns: ["", 整体 CPI, 核心 CPI]
      rows:
        - [包含范围, 一篮子全部商品与服务, 剔除食品与能源]
        - [波动特征, 大，受供给冲击主导, 小，反映需求与工资]
        - [适用场景, 衡量生活成本变化, 判断通胀趋势]
    - type: case
      label: 微案例
      title: 一次油价冲击
      nums: [{label: 油价同比, v: +35%}, {label: 整体 CPI 抬升, v: 约 1.2 个百分点}]
      body: 整体 CPI 跳升，核心 CPI 几乎不动。若央行因此加息，会误伤并未过热的需求。
    - type: flow
      label: 指数是怎么算出来的
      steps:
        - {label: 选定一篮子, note: 按居民消费结构}
        - {label: 采集价格, note: 各品类定期采价}
        - {label: 加权汇总, note: 按支出权重}
        - {label: 对比基期, note: 得到同比与环比}
  links:
    - {to: econ.macro.inflation-expectation, reason: 延伸：核心通胀与预期互相强化}
    - {to: hotspot.data.pmi-reading, reason: 关联：另一类月度经济数据怎么看}

- id: econ.macro.gdp-three-ways
  domain: econ
  track: macro
  title: GDP 的三种核算
  one_liner: 同一个 GDP，为什么有三个算法？
  key_points:
    - 生产法、收入法、支出法，理论上必然相等
    - 三法结果不一致时，差额就是统计误差
  difficulty: 2
  tags: [GDP, 核算]
  order: 5
  updated_at: 2026-09-21
  recipe: [prose, compare, flow, case]
  blocks:
    - {type: prose, label: 定义, body: "GDP 可以从**谁生产、谁拿到钱、谁花出去**三个角度算。因为是同一笔经济活动的三个切面，理论上必然相等，实际中的差额记为统计误差。"}
    - type: compare
      label: 三种算法
      columns: ["", 生产法, 收入法, 支出法]
      rows:
        - [看的角度, 各部门增加值, 要素报酬, 最终使用]
        - [主要构成, 各行业增加值之和, 工资加利息加利润加税收, 消费加投资加政府支出加净出口]
        - [常见用途, 看产业结构, 看分配格局, 看需求结构]
    - type: flow
      label: 支出法的构成
      steps:
        - {label: 居民消费, note: 占比最高}
        - {label: 资本形成, note: 投资}
        - {label: 政府支出, note: 财政发力}
        - {label: 净出口, note: 出口减进口}
    - {type: case, label: 微案例, title: 数据修订, nums: [{label: 首次公布与终值差, v: 常见 0.3 个百分点内}], body: 分季核算后期修订是常态，判断趋势要看连续几个季度的方向，而不是单点数字。}
  links:
    - {to: econ.macro.fiscal-multiplier, reason: 延伸：政府支出对产出的放大效应}
    - {to: econ.macro.okuns-law, reason: 延伸：产出与失业的经验关系}

- id: econ.macro.fiscal-multiplier
  domain: econ
  track: macro
  title: 财政乘数
  one_liner: 政府多花一块钱，总需求会多出几块？
  key_points:
    - 乘数大小取决于漏损：储蓄、税收、进口
    - 产能闲置时乘数大，满负荷时接近零
  difficulty: 3
  tags: [财政, 乘数]
  order: 6
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, dataviz, scale]
  blocks:
    - {type: prose, label: 定义, body: "政府支出变成某人的收入，他又花掉一部分，再变成别人的收入——层层递推。**边际消费倾向越高、漏损越少，乘数越大**。"}
    - type: formula
      label: 简单乘数
      latex: k = \frac{1}{1 - c(1-t) + m}
      note: c 为边际消费倾向，t 为税率，m 为边际进口倾向
      symbols:
        - {s: c, m: 收入中用于消费的比例}
        - {s: t, m: 收入中被征税的比例}
        - {s: m, m: 收入中用于进口的比例}
    - type: curve
      label: 乘数随漏损衰减
      xLabel: 漏损比例
      yLabel: 乘数
      xDomain: [0, 1]
      yDomain: [0, 6]
      series:
        - {name: 乘数曲线, points: [[0.1, 1.11], [0.2, 1.25], [0.4, 1.67], [0.6, 2.5], [0.8, 5]]}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.5", t: "深度衰退\n产能大量闲置"}
        - {v: "1.0", t: "约束较多\n税率与进口都高"}
        - {v: "1.5+", t: "接近满负荷\n挤出效应明显"}
    - type: dataviz
      label: 不同情形下的乘数估计
      chart: bar
      xLabel: 情形
      yLabel: 乘数
      xTicks: [深度衰退, 常规下行, 接近满负荷, 高开放度]
      series: [{name: 乘数估计, points: [2.1, 1.4, 0.7, 0.5]}]
      source: 示意数据，仅用于说明乘数随约束增强而衰减
  links:
    - {to: econ.macro.gdp-three-ways, reason: 前置：政府支出是 GDP 的组成部分}
    - {to: econ.micro.taxes-incidence, reason: 延伸：税收最后落在谁身上}

- id: econ.macro.okuns-law
  domain: econ
  track: macro
  title: 奥肯定律
  one_liner: 产出掉 2%，失业率会升多少？
  key_points:
    - 产出缺口每扩大 1%，失业率约升 0.5 个百分点
    - 这是经验规律，不同国家与时期系数会变
  difficulty: 2
  tags: [失业, 产出]
  order: 7
  updated_at: 2026-09-21
  recipe: [prose, curve, compare, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "奥肯定律描述**产出缺口与失业率变动**之间的经验关系：产出低于潜在水平越多，失业率上升越多。系数是统计出来的，不是推导出来的。"}
    - type: curve
      label: 产出缺口与失业率
      xLabel: 产出缺口 %
      yLabel: 失业率变动 百分点
      xDomain: [-6, 4]
      yDomain: [-3, 4]
      series:
        - {name: 经验关系, points: [[-6, 3], [-4, 2], [-2, 1], [0, 0], [2, -1], [4, -2]]}
    - type: compare
      label: 成立与不成立
      columns: ["", 经验关系成立时, 关系减弱时]
      rows:
        - [劳动力参与, 稳定, 大量人退出劳动力市场]
        - [生产率, 变化平缓, 企业先减产不裁人]
        - [常见时期, 常规周期, 深度衰退初期]
    - {type: pitfall, label: 误区, wrong: 产出回升，失业率就会立刻下降。, right: 企业往往先增加工时、再招人，就业恢复滞后。, why: 劳动关系有调整成本，裁员与招人都不是即时的。}
  links:
    - {to: econ.macro.gdp-three-ways, reason: 前置：产出怎么衡量}
    - {to: econ.macro.phillips-curve, reason: 延伸：失业与通胀的另一条经验关系}

- id: econ.macro.money-multiplier
  domain: econ
  track: macro
  title: 货币乘数
  one_liner: 央行投放 1 亿，为什么市场多了好几亿？
  key_points:
    - 乘数等于准备金率的倒数，但会被现金漏损压低
    - 银行不贷款时，乘数机制空转
  difficulty: 3
  tags: [货币, 银行]
  order: 8
  updated_at: 2026-09-21
  recipe: [prose, formula, flow, scale]
  blocks:
    - {type: prose, label: 定义, body: "银行收到存款只留一部分做准备金，其余贷出；贷款又变成别人的存款。**同一笔基础货币被反复使用**，广义货币因此成倍扩张。"}
    - type: formula
      label: 简单货币乘数
      latex: m = \frac{1 + c}{r + c}
      note: r 为准备金率，c 为现金与存款之比
      symbols:
        - {s: r, m: 法定与超额准备金率之和}
        - {s: c, m: 公众持有现金占存款的比例}
    - type: flow
      label: 存款创造过程
      steps:
        - {label: 央行投放, note: 基础货币}
        - {label: 银行留准备金, note: 按比例}
        - {label: 其余贷出, note: 变成他人存款}
        - {label: 循环再贷, note: 逐轮衰减}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "1.0", t: "极端情形\n银行不放贷"}
        - {v: "5", t: "准备金率 20%\n现金漏损小"}
        - {v: "10", t: "准备金率 10%\n接近上限"}
  links:
    - {to: econ.macro.monetary-transmission, reason: 前置：货币如何影响实体}
    - {to: hotspot.data.social-financing, reason: 关联：社融与货币供应量的差别}

- id: econ.macro.exchange-rate-regime
  domain: econ
  track: macro
  title: 汇率制度
  one_liner: 固定汇率和独立货币政策，为什么只能选一个？
  key_points:
    - 固定汇率、资本自由流动、独立货币政策三者只能取二
    - 多数经济体选择中间路线，带管理浮动
  difficulty: 3
  tags: [汇率, 政策]
  order: 9
  updated_at: 2026-09-21
  recipe: [prose, compare, flow, timeline, case]
  blocks:
    - {type: prose, label: 定义, body: "汇率制度是「用什么规则决定本币对外价格」。核心约束是**不可能三角**：固定汇率、资本自由流动、独立货币政策，三者只能同时满足两个。"}
    - type: compare
      label: 三种典型选择
      columns: ["", 放弃独立货币政策, 放弃固定汇率, 放弃资本自由流动]
      rows:
        - [代表安排, 货币局与共同货币, 自由浮动, 严格资本管制]
        - [代价, 利率跟随外部, 汇率波动大, 配置效率损失]
        - [常见场景, 小型开放经济体, 大型经济体, 转型期]
    - type: timeline
      label: 制度演变
      events:
        - {date: "1944", title: 布雷顿森林体系, note: 美元与黄金挂钩，其余货币盯美元。}
        - {date: "1973", title: 转向浮动, note: 固定汇率体系解体。, hot: true}
        - {date: "1990s", title: 中间制度消失论, note: 认为只剩两极可行。}
        - {date: "2000s 后", title: 中间路线回归, note: 带管理浮动被广泛采用。}
    - {type: case, label: 微案例, title: 联系汇率制, nums: [{label: 利率自主权, v: 基本放弃}], body: 为了守住固定汇率，当地利率必须跟随锚货币，代价是本地经济周期与外部不同步时无法独立调节。}
    - type: flow
