      xLabel: 数量 Q
      yLabel: 价格 P
      xDomain: [0, 10]
      yDomain: [0, 10]
      note: 征税后价格上升的幅度，取决于供需曲线谁更陡。
      series:
        - {name: 需求, points: [[1, 9], [3, 7], [5, 5], [7, 3], [9, 1]]}
        - {name: 供给, points: [[1, 1], [3, 3], [5, 5], [7, 7], [9, 9]]}
        - {name: 征税后的供给, points: [[1, 2.5], [3, 4.5], [5, 6.5], [7, 8.5]], dash: 5}
    - type: flow
      label: 税负转移路径
      steps:
        - {label: 法定纳税, note: 名义上由谁缴}
        - {label: 价格调整, note: 供给侧提价}
        - {label: 数量减少, note: 成交萎缩}
        - {label: 实际分担, note: 由相对弹性决定}
    - {type: pitfall, label: 误区, wrong: 向商家征税，负担就全在商家。, right: 商家会把能转的部分加到价格上，转不动的才自己承担。, why: 价格是双方博弈的结果，法定纳税人与实际承担者经常不同。}
  links:
    - {to: econ.micro.price-elasticity, reason: 前置：弹性决定能转嫁多少}
    - {to: econ.micro.consumer-surplus, reason: 延伸：税负造成的无谓损失}

# ============================ 计量经济 ============================

- id: econ.econometrics.endogeneity
  domain: econ
  track: econometrics
  title: 内生性
  one_liner: 回归系数显著，就说明因果关系成立吗？
  key_points:
    - 内生性等于解释变量与误差项相关
    - 显著性和拟合优度都救不了它
  difficulty: 3
  tags: [因果推断, 回归]
  order: 19
  updated_at: 2026-09-21
  recipe: [prose, formula, flow, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "内生性指解释变量**与误差项相关**。一旦出现，最小二乘估计不再无偏，系数也就不能解释为因果效应。这是实证研究里最常见也最容易被忽视的陷阱。"}
    - type: formula
      label: OLS 的偏误
      latex: \hat{\beta} = \beta + \frac{Cov(X, \varepsilon)}{Var(X)}
      note: 只要分子不为零，估计量就偏离真值
      symbols:
        - {s: '\hat{\beta}', m: 估计出的系数}
        - {s: '\beta', m: 真实的因果效应}
        - {s: 'Cov(X, \varepsilon)', m: 解释变量与误差项的相关性}
    - type: flow
      label: 偏误是怎么产生的
      steps:
        - {label: 遗漏重要变量, note: 比如能力}
        - {label: 该变量进入误差项, note: 没被控制}
        - {label: 它与 X 相关, note: 能力强的人受教育更多}
        - {label: 系数被污染, note: 不再等于因果效应}
    - {type: pitfall, label: 误区, wrong: 系数显著、拟合优度高，结论就可信。, right: 显著性只说明统计上不为零，不说明它估计的是因果效应。, why: 内生性带来的是系统性偏误，样本再大也不会消失。}
  links:
    - {to: econ.econometrics.instrumental-variable, reason: 解法：用一个外生变量把它撬开}
    - {to: finance.quant.ic-icir, reason: 延伸：因子检验里的同类问题}

- id: econ.econometrics.ols-assumptions
  domain: econ
  track: econometrics
  title: OLS 基本假设
  one_liner: 最小二乘什么时候才是"最好"的估计？
  key_points:
    - 无偏靠外生性与无完全共线性
    - 有效靠同方差与无自相关
  difficulty: 3
  tags: [回归, 假设]
  order: 20
  updated_at: 2026-09-21
  recipe: [prose, formula, compare, flow, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "OLS 的性质是**在假设下成立**的。哪些假设决定无偏、哪些决定有效，分开记才不容易混。"}
    - type: compare
      label: 假设破坏后的后果
      columns: ["", 影响无偏性, 影响有效性]
      rows:
        - [解释变量与误差相关, 是, 是]
        - [完全共线性, 是, 无法估计]
        - [异方差, 否, 是]
        - [自相关, 否, 是]
    - type: formula
      label: 异方差下的标准误修正
      latex: \hat{V}_{HC} = (X'X)^{-1} \left( \sum_i u_i^2 x_i x_i' \right) (X'X)^{-1}
      note: 系数点估计不变，只修正标准误
      symbols:
        - {s: u_i, m: 第 i 个观测的残差}
        - {s: x_i, m: 第 i 个观测的解释变量}
    - {type: pitfall, label: 误区, wrong: 有异方差就必须换模型。, right: 异方差影响的是标准误，用稳健标准误即可，点估计不用改。, why: 无偏性不依赖同方差，有效性才依赖它。}
    - type: flow
      label: 假设与性质的对应
      steps:
        - {label: 外生性, note: 保证无偏}
        - {label: 无完全共线, note: 保证可估计}
        - {label: 同方差与无自相关, note: 保证有效}
        - {label: 正态性, note: 保证小样本下的检验可靠}
  links:
    - {to: econ.econometrics.multicollinearity, reason: 延伸：共线性到底坏在哪}
    - {to: econ.econometrics.r-squared, reason: 延伸：拟合优度能说明什么}

- id: econ.econometrics.r-squared
  domain: econ
  track: econometrics
  title: R² 与调整 R²
  one_liner: 加变量一定让 R² 变大，那它还有什么用？
  key_points:
    - R² 只说明解释了多少方差，不说明因果
    - 加变量必然抬高 R²，所以要看调整 R²
  difficulty: 2
  tags: [回归, 拟合]
  order: 21
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, flow, scale]
  blocks:
    - {type: prose, label: 定义, body: "R² 是**被解释的方差比例**。它不衡量因果，也不衡量预测能力在样本外的表现。加任何一个变量都会让它上升，哪怕那个变量毫无意义。"}
    - type: formula
      label: 调整 R²
      latex: \bar{R}^2 = 1 - \frac{(1 - R^2)(n - 1)}{n - k - 1}
      note: 对加入变量施加惩罚，只有真正提升解释力才会上升
      symbols:
        - {s: n, m: 样本量}
        - {s: k, m: 解释变量个数}
    - type: flow
      label: 怎么判断 R² 有没有意义
      steps:
        - {label: 先看研究类型, note: 实验还是观测}
        - {label: 再看变量个数, note: 有没有加过无关变量}
        - {label: 最后看样本外, note: 预测能力才是硬标准}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.02", t: "预测收益\n已经很不错"}
        - {v: "0.3", t: "截面研究\n解释力可观"}
        - {v: "0.9", t: "受控实验\n或存在共线性问题"}
    - type: curve
      label: 加入无关变量后两条线的分歧
      xLabel: 加入的无关变量个数
      yLabel: 数值
      xDomain: [0, 10]
      yDomain: [0, 1]
      note: R² 单调上升，调整 R² 先升后降——后者才反映真实解释力。
      series:
        - {name: R², points: [[0, 0.42], [2, 0.46], [4, 0.49], [6, 0.52], [8, 0.54], [10, 0.56]]}
        - {name: 调整 R², points: [[0, 0.41], [2, 0.44], [4, 0.45], [6, 0.45], [8, 0.44], [10, 0.42]], dash: 5}
  links:
    - {to: econ.econometrics.ols-assumptions, reason: 前置：这些性质在什么假设下成立}
    - {to: finance.quant.ic-icir, reason: 关联：因子研究更关心什么指标}

- id: econ.econometrics.multicollinearity
  domain: econ
  track: econometrics
  title: 多重共线性
  one_liner: 系数正负号很怪，模型到底哪里出了问题？
  key_points:
    - 共线性不产生偏误，但会让系数极不稳定
    - 完全共线时根本估不出来
  difficulty: 3
  tags: [回归, 共线]
  order: 22
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "当两个或多个解释变量**高度线性相关**时，模型无法区分它们各自的贡献。系数本身仍是无偏的，但**方差被放大**，符号可能随机翻转。"}
    - type: curve
      label: 共线性如何放大系数方差
      xLabel: 变量间相关性
      yLabel: 系数标准误倍数
      xDomain: [0, 1]
      yDomain: [1, 10]
      series:
        - {name: 方差膨胀, points: [[0, 1], [0.5, 1.15], [0.8, 1.67], [0.9, 2.29], [0.99, 7.09]]}
    - type: formula
      label: 方差膨胀因子
      latex: VIF_j = \frac{1}{1 - R_j^2}
      note: 经验阈值：VIF 大于 10 一般认为共线性严重
      symbols:
        - {s: R_j^2, m: 用其余变量回归第 j 个变量的拟合优度}
    - {type: pitfall, label: 误区, wrong: 共线性会导致预测不准，必须删变量。, right: 共线性主要破坏的是系数解释，对整体预测影响有限。, why: 预测用的是变量的组合，系数虽不稳但总和仍稳。}
  links:
    - {to: econ.econometrics.ols-assumptions, reason: 前置：无完全共线性是基本假设之一}
    - {to: econ.econometrics.r-squared, reason: 延伸：VIF 与拟合优度的关系}

- id: econ.econometrics.diff-in-diff
  domain: econ
  track: econometrics
  title: 双重差分
  one_liner: 政策已经落地了，怎么知道真的是政策起的作用？
  key_points:
    - 用对照组的变化剔除掉共同趋势
    - 前提是平行趋势假设成立
  difficulty: 3
  tags: [因果推断, 政策评估]
  order: 23
  updated_at: 2026-09-21
  recipe: [prose, formula, flow, case]
  blocks:
    - {type: prose, label: 定义, body: "双重差分用**处理组前后变化减去对照组前后变化**。对照组不受政策影响，它的变化代表了「本来会发生什么」，减掉它，剩下的才是政策的净效应。"}
    - type: flow
      label: 四个格子
      steps:
        - {label: 处理组政策前, note: A}
        - {label: 处理组政策后, note: B}
        - {label: 对照组政策前, note: C}
        - {label: 对照组政策后, note: D}
    - type: formula
      label: 双重差分估计量
      latex: \hat{\tau} = (B - A) - (D - C)
      note: 两个差分再做差，共同趋势被抵消
      symbols:
        - {s: A, m: 处理组政策前均值}
        - {s: B, m: 处理组政策后均值}
        - {s: C, m: 对照组政策前均值}
        - {s: D, m: 对照组政策后均值}
    - {type: case, label: 微案例, title: 最低工资与就业, nums: [{label: 处理组就业变化, v: -1.2%}, {label: 对照组就业变化, v: -1.5%}], body: 两组都在下降，但处理组降得更少，双重差分给出 +0.3 个百分点的净效应。}
  links:
    - {to: econ.econometrics.endogeneity, reason: 前置：为什么要用这种设计}
    - {to: econ.econometrics.instrumental-variable, reason: 对比：另一种识别策略}

- id: econ.econometrics.instrumental-variable
  domain: econ
  track: econometrics
  title: 工具变量
  one_liner: 有个变量只通过它影响结果，这能用来做什么？
  key_points:
    - 工具变量要相关且外生，两个条件缺一不可
    - 弱工具变量比不工具变量更糟
  difficulty: 3
  tags: [因果推断, 工具变量]
  order: 24
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, flow, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "工具变量 Z 只**通过 X 影响 Y**，且不受遗漏因素干扰。它像一只外生的手，把 X 中「干净」的那部分变化挑出来，用它去估计因果效应。"}
    - type: formula
      label: 两阶段最小二乘
      latex: \hat{\beta}_{IV} = \frac{Cov(Z, Y)}{Cov(Z, X)}
      note: 分子是工具对结果的影响，分母是工具对内生变量的影响
      symbols:
        - {s: Z, m: 工具变量}
        - {s: X, m: 内生解释变量}
        - {s: Y, m: 被解释变量}
    - type: flow
      label: 识别的三个条件
      steps:
        - {label: 相关性, note: 工具要影响 X}
        - {label: 外生性, note: 工具不直接影响 Y}
        - {label: 排除性, note: 工具只通过 X 起作用}
    - {type: pitfall, label: 误区, wrong: 随便找个相关变量当工具就行。, right: 弱工具变量会把偏误放大，比直接回归更糟。, why: 分母趋近零时估计量方差爆炸，还会偏向原模型的偏误方向。}
    - type: curve
      label: 工具越弱，估计越不可靠
      xLabel: 第一阶段相关强度
      yLabel: 估计量方差倍数
      xDomain: [0, 1]
      yDomain: [1, 12]
      note: 相关强度趋近零时方差急剧膨胀，还会向原偏误方向收敛。
      series:
        - {name: 方差膨胀, points: [[0.05, 11], [0.15, 4.5], [0.3, 2.4], [0.5, 1.6], [0.7, 1.25], [0.9, 1.05]]}
  links:
    - {to: econ.econometrics.endogeneity, reason: 前置：要解决的到底是什么问题}
    - {to: econ.econometrics.diff-in-diff, reason: 对比：另一种识别策略}
