- id: econ.macro.inflation-expectation
  domain: econ
  track: macro
  title: 通胀预期
  one_liner: 还没涨价，为什么大家已经在按涨价做打算了？
  key_points:
    - 预期会自我实现：怕涨就先买、先提价
    - 锚定得住的预期，比一次加息更值钱
  difficulty: 3
  tags: [通胀, 预期]
  order: 10
  updated_at: 2026-09-21
  recipe: [prose, curve, pitfall, case, scale]
  blocks:
    - {type: prose, label: 定义, body: "通胀预期是人们对未来物价的判断。它会**改变当下的行为**——工人要求加薪、企业提前提价、居民提前购买，于是预期的通胀真的发生了。"}
    - type: curve
      label: 预期上移推动曲线
      xLabel: 失业率 u
      yLabel: 通胀率
      xDomain: [0, 10]
      yDomain: [0, 12]
      note: 预期上移会把整条短期曲线向上推，而不是沿曲线移动。
      series:
        - {name: 预期通胀 2%, points: [[1.5, 9], [3, 7], [5, 5], [7, 3.5], [9, 2.5]]}
        - {name: 预期通胀 5%, points: [[1.5, 12], [3, 10], [5, 8], [7, 6.5], [9, 5.5]]}
    - type: case
      label: 微案例
      title: 工资与价格的螺旋
      nums: [{label: 谈判工资涨幅, v: +8%}, {label: 次年商品提价, v: +6%}]
      body: 工人按预期通胀要求加薪，企业把人工成本转嫁到价格上，价格又印证了工人的预期。这就是螺旋。
    - {type: pitfall, label: 误区, wrong: 只要压住实际物价，通胀就结束了。, right: 预期没锚住，压下去的价格很快会反弹。, why: 预期决定行为，行为决定价格。不管理预期只管理价格，是治标。}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.2 个点", t: "预期小幅上移\n暂时可控"}
        - {v: "1 个百分点", t: "工人开始要求补偿\n进入定价"}
        - {v: "5 个点以上", t: "锚定失效\n治理成本剧增"}
  links:
    - {to: econ.macro.phillips-curve, reason: 前置：预期如何改变这条曲线}
    - {to: econ.macro.cpi-vs-core, reason: 延伸：用哪个口径观察预期}

