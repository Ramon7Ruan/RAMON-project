- id: econ.micro.externality
  domain: econ
  track: micro
  title: 外部性
  one_liner: 为什么我的行为成本，要由别人承担？
  key_points:
    - 成本没进价格等于负外部性，产出过多
    - 矫正靠让外部成本进入定价，不是禁止
  difficulty: 2
  tags: [市场失灵, 福利]
  order: 12
  updated_at: 2026-09-21
  recipe: [prose, curve, compare, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "当一项活动的成本或收益**没有计入交易价格**时就产生了外部性。负外部性让市场产出**多于**社会最优，正外部性让产出**少于**社会最优。"}
    - type: compare
      label: 两类外部性
      columns: ["", 负外部性, 正外部性]
      rows:
        - [例子, 工厂排污与拥堵, 疫苗接种与基础研究]
        - [私人产出与社会最优, 私人产出过多, 私人产出过少]
        - [常见矫正手段, 庇古税与排放权交易, 补贴与专利保护]
    - type: case
      label: 微案例
      title: 一条河的两岸
      nums: [{label: 工厂私人成本, v: 100}, {label: 下游治水成本, v: 30}]
      body: 工厂只算自己的 100，社会实际付出 130。差额 30 没人付账，于是产量偏高。
    - {type: pitfall, label: 误区, wrong: 有外部性就应该直接禁止这项活动。, right: 目标是让外部成本进入定价，而不是消灭活动本身。, why: 排污的治本解是使私人成本等于社会成本，禁止通常代价过高。}
    - type: curve
      label: 负外部性下的产出过多
      xLabel: 产量 Q
      yLabel: 成本与收益
      xDomain: [0, 10]
      yDomain: [0, 10]
      note: 社会边际成本高于私人边际成本，市场均衡产量大于社会最优。
      series:
        - {name: 私人边际成本, points: [[1, 2], [3, 4], [5, 6], [7, 8], [9, 9.5]]}
        - {name: 社会边际成本, points: [[1, 3.5], [3, 5.5], [5, 7.5], [7, 9], [9, 10]], dash: 5}
        - {name: 边际收益, points: [[1, 9], [3, 7], [5, 5], [7, 3], [9, 1.5]]}
  links:
    - {to: econ.micro.opportunity-cost, reason: 前置：成本应该怎么算}
    - {to: econ.micro.market-structure, reason: 延伸：市场失灵的另一类来源}
    - {to: hotspot.event.semiconductor-export-control, reason: 案例：管制把成本外部化给整条产业链}

- id: econ.micro.marginal-cost
  domain: econ
  track: micro
  title: 边际成本
  one_liner: 已经投了那么多，为什么还要看最后一单位？
  key_points:
    - 决策看下一个单位，不看已经花掉的
    - 边际成本等于价格时利润最大
  difficulty: 2
  tags: [成本, 决策]
  order: 13
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, compare, scale]
  blocks:
    - {type: prose, label: 定义, body: "边际成本是**多生产一单位**带来的成本增量。平均成本包含已经沉没的历史投入，而边际成本回答的是「下一步该不该做」。"}
    - type: formula
      label: 利润最大化条件
      latex: MC = MR
      note: 竞争市场中 MR 等于价格 P，于是条件简化为 MC = P
      symbols:
        - {s: MC, m: 边际成本}
        - {s: MR, m: 边际收益}
    - type: curve
      label: 边际成本与平均成本
      xLabel: 产量 Q
      yLabel: 单位成本
      xDomain: [0, 10]
      yDomain: [0, 12]
      note: 边际成本曲线穿过平均成本曲线的最低点。
      series:
        - {name: 平均成本, points: [[1, 11], [2, 7.5], [3, 6], [5, 5.2], [7, 5.6], [9, 6.8]]}
        - {name: 边际成本, points: [[1, 3], [2, 4], [3, 5], [5, 6], [7, 7.5], [9, 9.5]], dash: 5}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "低于 AC", t: "拉低平均成本"}
        - {v: "等于 AC", t: "平均成本最低"}
        - {v: "高于 AC", t: "推高平均成本"}
    - type: compare
      label: 两个成本指标各管什么
      columns: ["", 边际成本, 平均成本]
      rows:
        - [回答的问题, 下一步该不该做, 整体赚不赚钱]
        - [受沉没成本影响, 不受, 受]
        - [定价中的角色, 决定最优产量, 决定盈亏平衡点]
  links:
    - {to: econ.micro.market-structure, reason: 延伸：不同市场结构下的定价能力}
    - {to: econ.micro.utility-marginal, reason: 对比：需求侧的边际思维}

- id: econ.micro.consumer-surplus
  domain: econ
