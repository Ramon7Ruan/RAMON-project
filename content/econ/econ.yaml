- id: econ.micro.market-structure
  domain: econ
  track: micro
  title: 市场结构
  one_liner: 同样的成本，为什么有的行业能长期赚超额利润？
  key_points:
    - 进入壁垒决定能否长期赚超额利润
    - 集中度高的行业，价格更可能高于边际成本
  difficulty: 2
  tags: [竞争, 定价]
  order: 15
  updated_at: 2026-09-21
  recipe: [prose, dataviz, compare, flow, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "市场结构按**厂商数量与进入壁垒**划分。完全竞争下价格等于边际成本，长期没有超额利润；垄断下价格高于边际成本，超额利润可以持续。"}
    - type: compare
      label: 四种结构
      columns: ["", 完全竞争, 垄断竞争, 寡头, 垄断]
      rows:
        - [厂商数量, 很多, 较多, 少数, 一家]
        - [进入壁垒, 无, 低, 高, 极高]
        - [长期超额利润, 无, 趋于零, 可能存在, 持续存在]
    - type: dataviz
      label: 集中度与利润率
      chart: bar
      xLabel: 行业集中度区间
      yLabel: 平均销售利润率 %
      xTicks: ["低", "中低", "中", "中高", "高"]
      series: [{name: 平均利润率, points: [3.1, 4.2, 5.6, 7.8, 11.4]}]
      source: 示意数据，仅用于说明相关性方向
    - {type: pitfall, label: 误区, wrong: 高利润就说明有垄断。, right: 也可能是效率更高或承担了更高风险。, why: 判断垄断要看进入壁垒与定价能力，利润本身不是证据。}
    - type: flow
      label: 定价能力从哪来
      steps:
        - {label: 进入壁垒, note: 决定竞争者能否进来}
        - {label: 厂商数量, note: 决定彼此牵制程度}
        - {label: 定价能力, note: 价格偏离边际成本的空间}
        - {label: 长期利润, note: 壁垒在则超额利润在}
  links:
    - {to: econ.micro.marginal-cost, reason: 前置：定价的基准是什么}
    - {to: econ.micro.externality, reason: 对比：另一类市场失灵}

