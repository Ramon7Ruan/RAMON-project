- id: finance.fund.tracking-error
  domain: finance
  track: fund
  title: 跟踪误差
  one_liner: 指数基金「跟得紧」怎么量化？
  key_points:
    - 跟踪误差是收益差的标准差，衡量稳不稳
    - 跟踪偏离度是收益差的均值，衡量准不准
  difficulty: 2
  tags: [基金, 指数]
  order: 14
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, scale]
  blocks:
    - {type: prose, label: 定义, body: "跟踪误差是基金收益率与标的指数收益率之差的**波动率**。注意它衡量的是**偏离的稳定性**，不是偏离的平均大小——后者叫跟踪偏离度。"}
    - type: formula
      label: 两个易混指标
      latex: TE = \sigma(r_p - r_b), \quad TD = \overline{r_p - r_b}
      note: 一个是标准差，一个是均值
      symbols:
        - {s: TE, m: 跟踪误差，偏离的波动}
        - {s: TD, m: 跟踪偏离度，偏离的中枢}
    - type: dataviz
      label: 日度偏离分布
      chart: bar
      xLabel: 日度偏离区间
      yLabel: 天数
      xTicks: ["<-30bp", "-30~-10", "-10~0", "0~10", "10~30", ">30bp"]
      series: [{name: 样本天数, points: [3, 22, 51, 48, 19, 4]}]
      source: 示意数据，仅用于说明分布形态
    - type: scale
      label: 数量级锚定
      ticks:
        - {v: "0.05%", t: "优秀\n基本贴合指数"}
        - {v: "0.20%", t: "一般\n多数指数基金水平"}
        - {v: "0.50%", t: "偏差明显\n需要看成因"}
  links:
    - {to: finance.fund.expense-ratio, reason: 前置：偏离的主要来源之一是费率}
    - {to: finance.quant.ic-icir, reason: 延伸：同类"均值与稳定性"的判读思路}
    - {to: finance.fund.etf-premium, reason: 延伸：折溢价与跟踪误差同源，都来自申赎与流动性}
    - {to: finance.quant.sharpe-sortino, reason: 对照：同样用标准差，一个衡量收益质量，一个衡量跟踪偏离}

- id: finance.fund.expense-ratio
  domain: finance
  track: fund
  title: 费率
  one_liner: 一年差 0.5% 的费率，十年差多少？
  key_points:
    - 费率是确定的负收益，收益是不确定的
    - 长期持有下，费率差异会被复利放大
  difficulty: 1
  tags: [基金, 成本]
  order: 15
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, flow, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "基金费率包括管理费、托管费、销售服务费与交易佣金。**它是唯一确定的负收益**——市场收益不确定，费率一定扣。"}
    - type: formula
      label: 费率的长期侵蚀
      latex: V_T = V_0 (1 + r - f)^T
      note: 同样的毛收益，费率每高 0.5%，长期净值差距被复利放大
      symbols:
        - {s: r, m: 毛收益率}
        - {s: f, m: 年化费率}
        - {s: T, m: 持有年数}
    - type: dataviz
      label: 十年后的差距
      chart: bar
      xLabel: 年化费率
      yLabel: 十年后净值 以 1 为基准
      xTicks: ["0.2%", "0.5%", "1.0%", "1.5%", "2.0%"]
      series: [{name: 净值, points: [2.23, 2.13, 1.98, 1.83, 1.7]}]
      source: 示意数据，假设毛收益 9%
    - {type: pitfall, label: 误区, wrong: 费率低的就是好基金。, right: 低费率是必要条件，不是充分条件；要看跟踪质量或主动管理能力。, why: 省下的费率只有配上合格的策略才有意义。}
    - type: flow
      label: 费用在净值里的体现
      steps:
        - {label: 每日计提, note: 按年费率摊到每一天}
        - {label: 直接从净值扣, note: 不体现在交易记录里}
        - {label: 复利累积, note: 十年后被显著放大}
        - {label: 对比基准时, note: 必须用同一口径}
  links:
    - {to: finance.fund.tracking-error, reason: 延伸：费率如何体现为跟踪偏离}
    - {to: finance.fund.fof-double-fee, reason: 延伸：还有一层被忽视的费率}

- id: finance.fund.active-share
  domain: finance
  track: fund
  title: 主动份额
  one_liner: 一只基金到底有多主动？
  key_points:
    - 主动份额衡量持仓偏离基准的程度
    - 主动份额低却收主动管理费，值得警惕
  difficulty: 2
  tags: [基金, 基准]
  order: 16
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, compare]
  blocks:
    - {type: prose, label: 定义, body: "主动份额是**持仓权重与基准权重之差的绝对值之和的一半**。它衡量一只基金究竟偏离基准多远——名字里有「主动」不代表它真的主动。"}
    - type: formula
      label: 主动份额
      latex: AS = \frac{1}{2} \sum_{i} |w_i - b_i|
      note: 完全复制指数则为 0，完全不重叠则为 1
      symbols:
        - {s: w_i, m: 基金中第 i 只股票的权重}
        - {s: b_i, m: 基准中第 i 只股票的权重}
    - type: compare
      label: 主动份额与收费的匹配
      columns: ["", 高主动份额, 低主动份额]
      rows:
        - [承担风险, 偏离基准风险大, 接近指数表现]
        - [合理收费, 主动管理费有依据, 更像指数增强或复制]
        - [需要问, 超额收益能否持续, 为什么不直接买指数]
    - type: dataviz
      label: 主动份额分布
      chart: bar
      xLabel: 主动份额区间
      yLabel: 基金数量
      xTicks: ["0-20%", "20-40%", "40-60%", "60-80%", "80-100%"]
      series: [{name: 数量, points: [18, 24, 15, 8, 5]}]
      source: 示意数据，仅用于说明分布偏斜
  links:
    - {to: finance.fund.expense-ratio, reason: 延伸：收费要与主动性匹配}
    - {to: finance.equity.market-cap, reason: 前置：基准是怎么加权出来的}

- id: finance.fund.fof-double-fee
  domain: finance
  track: fund
  title: 双重收费
  one_liner: 买了 FOF，为什么成本比想象中高？
  key_points:
    - FOF 在底层基金费率之上再收一层
    - 关键看底层基金是否免收或返还管理费
  difficulty: 2
  tags: [基金, 成本]
  order: 17
  updated_at: 2026-09-21
  recipe: [prose, formula, compare, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "FOF 投资于其他基金，投资者要**付两层管理费**。行业常见做法是底层基金对 FOF 部分免收或返还管理费，但并非所有产品都这样。"}
    - type: formula
      label: 综合费率
      latex: f_{total} = f_{FOF} + \sum_{j} w_j \times f_j
      note: 若底层免收，第二项大幅下降
      symbols:
        - {s: 'f_{FOF}', m: FOF 自身管理费}
        - {s: w_j, m: 第 j 只底层基金的权重}
        - {s: f_j, m: 第 j 只底层基金的管理费}
    - type: case
      label: 微案例
      title: 两个产品的综合费率
      nums: [{label: 产品 A 综合费率, v: 0.85%}, {label: 产品 B 综合费率, v: 1.95%}]
      body: 表面管理费都在 0.8% 左右，差别出在底层是否免收。选 FOF 一定要看"是否双重收费"这一条。
    - {type: pitfall, label: 误区, wrong: 只看 FOF 自己标称的管理费就够了。, right: 必须看招募说明书里对底层基金收费的安排。, why: 双层收费的总额往往体现在底层，不在显眼处。}
    - type: compare
      label: 单层与双层
      columns: ["", 单层收费, 双层收费]
      rows:
        - [费用来源, 只有本基金, 本基金加底层基金]
        - [典型差距, 0.5 到 1 个百分点, 1.5 到 2.5 个百分点]
        - [是否合理, 看策略, 只有当底层确实免收时才合理]
  links:
    - {to: finance.fund.expense-ratio, reason: 前置：费率如何长期侵蚀收益}
    - {to: finance.fund.active-share, reason: 延伸：收费要给主动管理找到依据}

- id: finance.fund.etf-premium
  domain: finance
  track: fund
  title: ETF 折溢价
  one_liner: ETF 市价明明高于净值，为什么还能买？
  key_points:
    - 折溢价反映二级市场供需与套利效率
    - 溢价买入等于先亏掉溢价那部分
  difficulty: 2
  tags: [ETF, 套利]
  order: 18
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, flow, scale]
  blocks:
    - {type: prose, label: 定义, body: "ETF 有**两个价格**：二级市场的交易价与基金份额净值。两者偏离就是折溢价，套利机制会把它们拉回，但**拉回需要时间与额度**。"}
    - type: formula
      label: 折溢价率
      latex: Premium = \frac{P_{market} - NAV}{NAV}
      note: 正值是溢价，负值是折价
      symbols:
        - {s: 'P_{market}', m: 二级市场交易价}
        - {s: NAV, m: 基金份额净值}
    - type: dataviz
      label: 跨境 ETF 的溢价更常见
      chart: bar
      xLabel: ETF 类型
      yLabel: 平均溢价率 %
      xTicks: [宽基, 行业, 债券, 跨境, 商品]
      series: [{name: 平均溢价, points: [0.05, 0.08, 0.04, 1.8, 0.35]}]
      source: 示意数据，仅用于说明溢价的结构性差异
    - type: flow
      label: 套利如何抹平价差
      steps:
        - {label: 出现溢价, note: 买的人多于卖的人}
        - {label: 套利者申购, note: 用净值拿份额}
        - {label: 二级市场卖出, note: 赚取价差}
        - {label: 溢价收敛, note: 直到无利可图}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.1% 内", t: "正常摩擦\n无需在意"}
        - {v: "1% 左右", t: "需要注意\n会影响择时结果"}
        - {v: "5% 以上", t: "多为额度受限\n追高非常危险"}
  links:
    - {to: finance.fund.tracking-error, reason: 延伸：折溢价也算一种跟踪偏离}
    - {to: finance.bond.repo, reason: 关联：套利资金从哪来}

# ============================== 量化 ==============================

- id: finance.quant.ic-icir
  domain: finance
  track: quant
  title: IC 与 ICIR
  one_liner: 一个因子有预测力，怎么用数字证明？
  key_points:
    - IC 看方向对不对，ICIR 看稳不稳
    - 经验阈值 IC 大于 0.03，IR 大于 0.5
  difficulty: 3
  tags: [量化, 因子]
  order: 19
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, compare, scale]
  blocks:
    - {type: prose, label: 定义, body: "IC 是因子值与下期收益的横截面相关系数，衡量方向对不对；ICIR 是 IC 的均值除以标准差，衡量这个方向**稳不稳**。方向对但不稳的因子，实盘会亏钱。"}
    - type: formula
      label: ICIR
      latex: ICIR = \frac{mean(IC)}{std(IC)} \times \sqrt{T}
      note: 用期数平方根做年化
      symbols:
        - {s: mean(IC), m: 各期 IC 的均值}
        - {s: std(IC), m: 各期 IC 的标准差}
        - {s: T, m: 期数}
    - type: dataviz
      label: 两个因子的 IC 序列
      chart: bar
      xLabel: 期数
      yLabel: IC
      xTicks: ["1", "2", "3", "4", "5", "6", "7", "8"]
      series:
        - {name: 因子 A ICIR 高, points: [0.05, 0.04, 0.06, 0.05, 0.04, 0.05, 0.06, 0.05]}
        - {name: 因子 B ICIR 低, points: [0.14, 0.11, 0.03, 0.01, 0.09, 0.05, 0.12, 0.04]}
      source: 示意数据，仅用于说明 IC 稳定性差异
    - type: scale
      label: 经验阈值
      ticks:
        - {v: "0.01", t: "基本无预测力"}
        - {v: "0.03", t: "值得进一步研究"}
        - {v: "0.05", t: "较强\n需警惕过拟合"}
    - type: compare
      label: 两个指标的分工
      columns: ["", IC, ICIR]
      rows:
        - [衡量什么, 方向对不对, 方向稳不稳]
        - [受极端值影响, 大, 相对小]
        - [单独看会怎样, 高 IC 也可能不可交易, 低 IC 也可能稳定可赚]
  links:
    - {to: econ.econometrics.endogeneity, reason: 关联：同一类因果识别问题}
    - {to: finance.quant.backtest-overfitting, reason: 延伸：IC 高也可能是过拟合}
    - {to: finance.quant.factor-neutralization, reason: 延伸：中性化前后 IC 的变化，能看出因子混进了多少风格}

- id: finance.quant.factor-neutralization
  domain: finance
  track: quant
  title: 因子中性化
  one_liner: 剔掉行业和市值之后，因子还剩多少？
  key_points:
    - 中性化是为了排除其他因子的混入
    - 中性化后 IC 下降不一定说明因子变差
  difficulty: 3
  tags: [量化, 因子]
  order: 20
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, dataviz, compare]
  blocks:
    - {type: prose, label: 定义, body: "中性化是把因子值对行业、市值等**已知风格做回归，取残差**。目的是回答：这个因子扣掉行业和市值的贡献后，还有没有独立信息？"}
    - type: formula
      label: 回归取残差
      latex: f_i = \alpha + \beta_1 Ind_i + \beta_2 \ln(Size_i) + \varepsilon_i
      note: 用残差作为中性化后的因子值
      symbols:
        - {s: f_i, m: 原始因子值}
        - {s: Ind_i, m: 行业虚拟变量}
        - {s: '\varepsilon_i', m: 中性化后的因子}
    - type: compare
      label: 中性化前后
      columns: ["", 未中性化, 已中性化]
      rows:
        - [IC 水平, 通常更高, 会下降]
        - [信息纯度, 混入行业与市值暴露, 只剩独立信息]
        - [组合暴露, 可能重仓某个行业, 行业分布更均衡]
    - type: dataviz
      label: 中性化前后的 IC 变化
      chart: bar
      xLabel: 处理方式
      yLabel: IC
      xTicks: [原始, 对市值中性, 对行业中性, 双重中性]
      series: [{name: IC, points: [0.061, 0.048, 0.039, 0.031]}]
      source: 示意数据，仅用于说明 IC 会随中性化下降
    - type: curve
      label: 中性化强度与 IC 的关系
      xLabel: 中性化强度
      yLabel: IC
      xDomain: [0, 4]
      yDomain: [0, 0.08]
      note: 过度中性化会把因子的真实信息也一起抹掉。
      series:
        - {name: IC 走势, points: [[0, 0.061], [1, 0.048], [2, 0.038], [3, 0.026], [4, 0.014]]}
  links:
    - {to: finance.quant.ic-icir, reason: 前置：怎么衡量因子的预测力}
    - {to: econ.econometrics.multicollinearity, reason: 延伸：共线性与混入效应的区别}

- id: finance.quant.backtest-overfitting
  domain: finance
  track: quant
  title: 回测过拟合
  one_liner: 回测曲线很漂亮，实盘为什么亏？
  key_points:
    - 试的次数越多，偶然找到好参数的概率越大
    - 样本外与样本内差距是最直接的体检指标
  difficulty: 3
  tags: [量化, 回测]
  order: 21
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, pitfall, scale]
  blocks:
    - {type: prose, label: 定义, body: "回测过拟合是**在历史数据上反复调参，直到结果好看**。问题是历史只有一个，试得足够多，总能找到一个碰巧漂亮的参数组合。"}
    - type: formula
      label: 多重检验下的假发现
      latex: P(\text{至少一次显著}) = 1 - (1 - \alpha)^n
      note: 试 20 次、每次显著性 5%，出现假信号的概率接近 64%
      symbols:
        - {s: '\alpha', m: 单次检验的显著性水平}
        - {s: n, m: 尝试次数}
    - type: dataviz
      label: 样本内与样本外的分岔
      chart: line
      xLabel: 年份
      yLabel: 累计净值
      xTicks: ["1", "2", "3", "4", "5", "6", "7", "8"]
      series:
        - {name: 样本内拟合, points: [1.2, 1.5, 1.95, 2.5, 3.2, 4.1, 5.2, 6.6]}
        - {name: 样本外实际, points: [1.15, 1.3, 1.4, 1.35, 1.25, 1.1, 0.95, 0.82]}
      source: 示意数据，仅用于说明典型形态
    - {type: pitfall, label: 误区, wrong: 回测年化 40% 的策略值得上实盘。, right: 先问试了多少组参数、样本外表现如何、逻辑能否解释。, why: 没有经济学逻辑支撑的高回测收益，多数是数据挖掘的产物。}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "试用 5 组", t: "假发现概率约 23%"}
        - {v: "试用 20 组", t: "假发现概率约 64%"}
        - {v: "试用 100 组", t: "几乎必然找到好看结果"}
  links:
    - {to: finance.quant.walk-forward, reason: 解法：用滚动前推替代单次回测}
    - {to: finance.quant.ic-icir, reason: 前置：因子本身的稳定性怎么看}

- id: finance.quant.turnover-cost
  domain: finance
  track: quant
  title: 换手与交易成本
  one_liner: 年化 25% 的策略，扣掉成本还剩多少？
  key_points:
    - 成本等于换手率乘以单边成本，是确定的减法
    - 高换手策略对成本假设极其敏感
  difficulty: 2
  tags: [量化, 成本]
  order: 22
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, case, scale]
  blocks:
    - {type: prose, label: 定义, body: "交易成本包括佣金、印花税、冲击成本与机会成本。**换手率越高，成本越确定地吃掉收益**，而收益本身是不确定的。"}
    - type: formula
      label: 成本拖累
      latex: Cost_{annual} = Turnover \times (Fee + Impact) \times 2
      note: 买卖各算一次，所以乘 2
      symbols:
        - {s: Turnover, m: 年化换手率}
        - {s: Fee, m: 佣金与税费}
        - {s: Impact, m: 冲击成本}
    - type: curve
      label: 换手越高，净收益衰减越快
      xLabel: 年化换手率 倍
      yLabel: 成本拖累 %
      xDomain: [0, 12]
      yDomain: [0, 12]
      note: 假设单边成本 0.15%，换手 10 倍就意味着约 3% 的年度拖累。
      series:
        - {name: 成本拖累, points: [[1, 0.3], [2, 0.6], [4, 1.2], [6, 1.8], [8, 2.4], [10, 3], [12, 3.6]]}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.1%", t: "大盘股\n冲击成本小"}
        - {v: "0.3%", t: "中盘股\n常见水平"}
        - {v: "1%+", t: "小盘或流动性差\n成本吃掉大半收益"}
    - type: case
      label: 微案例
      title: 一个高换手策略的实测
      nums: [{label: 回测年化, v: 28%}, {label: 年化换手, v: 12 倍}, {label: 实盘年化, v: 9.4%}]
      body: 差距几乎全部来自成本。回测里假设的 0.1% 单边成本，在中小盘上实际可能到 0.35%。
  links:
    - {to: finance.quant.backtest-overfitting, reason: 前置：先确认收益是真的}
    - {to: finance.fund.expense-ratio, reason: 对比：费率与交易成本都是确定的减法}

- id: finance.quant.sharpe-sortino
  domain: finance
  track: quant
  title: 夏普与索提诺
  one_liner: 两个策略夏普一样，该选哪个？
  key_points:
    - 索提诺只把下行波动当风险
    - 收益分布偏斜时，两者会明显分歧
  difficulty: 2
  tags: [量化, 风险调整]
  order: 23
  updated_at: 2026-09-21
  recipe: [prose, formula, compare, flow, scale]
  blocks:
    - {type: prose, label: 定义, body: "夏普比率用**全部波动**做分母，索提诺只用**下行波动**。上涨带来的波动在夏普里是「风险」，在索提诺里不是——这是两者的根本区别。"}
    - type: formula
      label: 两个比率
      latex: Sharpe = \frac{R_p - R_f}{\sigma_p}, \quad Sortino = \frac{R_p - R_f}{\sigma_{down}}
      note: 分母一个是总标准差，一个只算下行部分
      symbols:
        - {s: '\sigma_p', m: 收益的总标准差}
        - {s: '\sigma_{down}', m: 下行标准差}
    - type: compare
      label: 什么情况下分歧大
      columns: ["", 夏普更适合, 索提诺更适合]
      rows:
        - [收益分布, 接近对称, 明显右偏]
        - [典型策略, 市场中性, 趋势跟踪]
        - [关注点, 整体波动控制, 避免大幅回撤]
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "0.5 左右", t: "勉强覆盖风险"}
        - {v: "1.0", t: "常见可接受水平"}
        - {v: "2.0 以上", t: "优秀\n先确认不是过拟合"}
    - type: flow
      label: 该用哪个的三步判断
      steps:
        - {label: 看收益分布, note: 是否明显偏斜}
        - {label: 看策略类型, note: 对冲还是方向性}
        - {label: 同时报两个, note: 分歧大时说明分布不对称}
  links:
    - {to: finance.fund.tracking-error, reason: 关联：标准差在不同场景下的用法}
    - {to: finance.quant.backtest-overfitting, reason: 延伸：比率高也可能是过拟合}

- id: finance.quant.walk-forward
  domain: finance
  track: quant
  title: 滚动前推验证
  one_liner: 一次回测不够，那怎么做才算够？
  key_points:
    - 每次只用当时可得的数据定参数
    - 把多段样本外的结果连起来看
  difficulty: 3
  tags: [量化, 验证]
  order: 24
  updated_at: 2026-09-21
  recipe: [prose, dataviz, flow, pitfall, scale]
  blocks:
    - {type: prose, label: 定义, body: "滚动前推是**用滚动窗口反复做样本内定参、样本外验证**，再把所有样本外区段连起来评估。它模拟了实盘中你只能知道「到此刻为止」的信息这一约束。"}
    - type: flow
      label: 滚动前推的流程
      steps:
        - {label: 取一段样本内, note: 确定参数}
        - {label: 紧接的样本外, note: 用固定参数运行}
        - {label: 窗口向前滚动, note: 重新定参}
        - {label: 拼接所有样本外, note: 得到真实感的业绩}
    - type: dataviz
      label: 拼接后的样本外曲线
      chart: line
      xLabel: 滚动期数
      yLabel: 累计净值
      xTicks: ["1", "2", "3", "4", "5", "6"]
      series:
        - {name: 样本外拼接, points: [1, 1.06, 1.11, 1.09, 1.18, 1.24]}
        - {name: 单次样本内, points: [1, 1.18, 1.42, 1.55, 1.9, 2.2]}
      source: 示意数据，仅用于说明两者的落差
    - {type: pitfall, label: 误区, wrong: 多切几段样本外就等于稳健了。, right: 如果每次定参都偷偷用了全样本信息，切再多段也无效。, why: 关键是信息可得性的时点，而不是切分次数。}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "3 到 5 段", t: "最低限度\n只能做方向判断"}
        - {v: "8 到 12 段", t: "较可靠\n能看出稳定性"}
        - {v: "20 段以上", t: "接近实盘体验\n但样本被大量占用"}
  links:
    - {to: finance.quant.backtest-overfitting, reason: 前置：要防的到底是什么}
    - {to: finance.quant.ic-icir, reason: 延伸：因子层面的稳定性检验}
    - {to: finance.quant.turnover-cost, reason: 前置：滚动前推必须把换手成本算进去，否则每段都虚高}
