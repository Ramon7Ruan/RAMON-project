- id: finance.bond.credit-spread
  domain: finance
  track: bond
  title: 信用利差
  one_liner: 同样是债，为什么有的多给 2% 利息？
  key_points:
    - 利差是违约风险与流动性的定价
    - 利差走阔往往先于违约事件
  difficulty: 2
  tags: [信用, 债券]
  order: 10
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, dataviz, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "信用利差是**信用债收益率减去同期限国债收益率**。它是对违约风险与流动性风险的补偿，也是市场情绪最灵敏的温度计之一。"}
    - type: formula
      label: 利差的构成
      latex: Spread = Y_{credit} - Y_{gov} \approx PD \times LGD + Liquidity
      note: 拆成违约概率、违约损失与流动性补偿三部分
      symbols:
        - {s: PD, m: 违约概率}
        - {s: LGD, m: 违约损失率}
        - {s: Liquidity, m: 流动性补偿}
    - type: dataviz
      label: 利差在不同阶段的走势
      chart: line
      xLabel: 阶段
      yLabel: 利差 bp
      xTicks: [平稳期, 担忧期, 承压期, 违约期, 修复期]
      series: [{name: 信用利差, points: [85, 120, 190, 320, 210]}]
      source: 示意数据，仅用于说明利差的周期特征
    - {type: pitfall, label: 误区, wrong: 利差高就是捡便宜的机会。, right: 要先分清是流动性冲击还是基本面恶化。, why: 两者的应对完全不同：前者会修复，后者可能继续恶化。}
    - type: curve
      label: 利差与违约概率
      xLabel: 隐含违约概率 %
      yLabel: 合理利差 bp
      xDomain: [0, 12]
      yDomain: [0, 900]
      note: 假设回收率 40%，利差至少要覆盖预期损失。
      series:
        - {name: 覆盖预期损失的利差, points: [[0, 0], [1, 60], [3, 180], [6, 360], [9, 540], [12, 720]]}
  links:
    - {to: finance.bond.default-recovery, reason: 前置：违约概率与回收率怎么估}
    - {to: finance.equity.roe-dupont, reason: 关联：杠杆如何影响信用资质}
    - {to: hotspot.event.evergrande-default, reason: 案例：信用利差从定价失效到重新定价的全过程}

- id: finance.bond.convexity
  domain: finance
  track: bond
  title: 凸性
  one_liner: 久期算出的价格变动，为什么总是不太准？
  key_points:
    - 久期是线性近似，凸性补上弯曲的部分
    - 凸性对持有人有利：涨得多、跌得少
  difficulty: 3
  tags: [债券, 利率风险]
  order: 11
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, compare, case]
  blocks:
    - {type: prose, label: 定义, body: "价格与收益率的关系是**弯曲**的，久期只取了切线。凸性描述这条曲线的弯曲程度，**利率变动越大，久期误差越大**。"}
    - type: formula
      label: 二阶近似
      latex: \frac{\Delta P}{P} \approx -D_{mod} \Delta y + \frac{1}{2} C (\Delta y)^2
      note: 凸性项永远为正，所以实际跌幅小于久期估计
      symbols:
        - {s: 'D_{mod}', m: 修正久期}
        - {s: C, m: 凸性}
    - type: curve
      label: 久期近似与实际价格
      xLabel: 收益率变动 %
      yLabel: 价格
      xDomain: [-3, 3]
      yDomain: [80, 130]
      note: 收益率大幅变动时，直线（久期）与曲线（实际）分道扬镳。
      series:
        - {name: 实际价格, points: [[-3, 124], [-2, 115], [-1, 107.5], [0, 100], [1, 93], [2, 86.5], [3, 80.5]]}
        - {name: 久期线性近似, points: [[-3, 121], [-2, 114], [-1, 107], [0, 100], [1, 93], [2, 86], [3, 79]], dash: 5}
    - type: compare
      label: 凸性的两面
      columns: ["", 高凸性, 低凸性]
      rows:
        - [利率下行时, 涨得更多, 涨得较少]
        - [利率上行时, 跌得更少, 跌得更多]
        - [代价, 通常收益率更低, 收益率补偿更高]
    - type: case
      label: 微案例
      title: 大幅降息时谁涨得多
      nums: [{label: 两只债久期, v: 都是 8 年}, {label: 凸性, v: 高 / 低}]
      body: 久期相同的两只债，在收益率大幅下行时，凸性高的那只涨得更多；上行时跌得更少。凸性不是免费的，它体现在更低的到期收益率上。
  links:
    - {to: finance.bond.duration, reason: 前置：一阶近似是什么}
    - {to: finance.bond.yield-curve, reason: 延伸：曲线形态变化如何影响凸性}

- id: finance.bond.repo
  domain: finance
  track: bond
  title: 回购与资金面
  one_liner: 隔夜利率突然跳升，市场在发生什么？
  key_points:
    - 回购是拿债券做抵押短期借钱
    - 资金利率跳升通常意味着抵押品或额度紧张
  difficulty: 3
  tags: [货币市场, 流动性]
  order: 12
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, flow, case]
  blocks:
    - {type: prose, label: 定义, body: "回购是**以债券为抵押的短期融资**。它是货币市场的基础设施，也是观察资金面松紧最直接的窗口——抵押品够不够、额度紧不紧，都会反映在利率上。"}
    - type: formula
      label: 回购利率与抵押折扣
      latex: Cash = \frac{Face \times (1 - Haircut)}{1 + r \times \frac{d}{365}}
      note: 折扣率越高，同样面值能借到的钱越少
      symbols:
        - {s: Face, m: 抵押债券面值}
        - {s: Haircut, m: 抵押折扣率}
        - {s: r, m: 回购利率}
        - {s: d, m: 期限天数}
    - type: dataviz
      label: 资金面的季节性波动
      chart: line
      xLabel: 时点
      yLabel: 隔夜利率 %
      xTicks: [月初, 月中, 税期, 月末, 季末, 年末]
      series: [{name: 隔夜利率, points: [1.6, 1.7, 2.4, 2.8, 3.6, 4.5]}]
      source: 示意数据，仅用于说明季节性规律
    - type: flow
      label: 资金紧张是怎么形成的
      steps:
        - {label: 缴税或缴准, note: 资金从银行体系流出}
        - {label: 大行融出减少, note: 自身头寸也紧}
        - {label: 非银借不到钱, note: 只能高价融入}
        - {label: 利率跳升, note: 传导到债券与股票估值}
    - type: case
      label: 微案例
      title: 一次季末资金紧张
      nums: [{label: 隔夜利率峰值, v: 5.8%}, {label: 平日水平, v: 1.7%}]
      body: 季末考核叠加缴准，大行减少融出，非银只能高价融入。这类波动通常几天内回落，但会传导到债券与股票估值。
  links:
    - {to: hotspot.data.social-financing, reason: 关联：实体融资的另一面}
    - {to: finance.bond.yield-curve, reason: 延伸：资金面如何影响短端}
    - {to: hotspot.event.us-debt-ceiling, reason: 案例：上限僵局如何直接冲击短期融资市场}

- id: finance.bond.default-recovery
  domain: finance
  track: bond
  title: 违约与回收率
  one_liner: 违约了就一定血本无归吗？
  key_points:
    - 预期损失等于违约概率乘以违约损失率
    - 回收率在行业与抵押结构之间差异极大
  difficulty: 3
  tags: [信用, 风险]
  order: 13
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, case]
  blocks:
    - {type: prose, label: 定义, body: "违约不等于归零。**回收率**决定了实际损失多少，而它取决于抵押物、清偿顺序与处置效率。把违约概率和回收率分开估，是信用分析的基本功。"}
    - type: formula
      label: 预期损失
      latex: EL = PD \times LGD = PD \times (1 - RR)
      note: 信用利差至少要覆盖预期损失，剩余部分才是风险溢价
      symbols:
        - {s: PD, m: 违约概率}
        - {s: LGD, m: 违约损失率}
        - {s: RR, m: 回收率}
    - type: dataviz
      label: 清偿顺序与回收率
      chart: bar
      xLabel: 债务类型
      yLabel: 回收率 %
      xTicks: [有抵押, 优先无抵押, 次级, 次级后段]
      series: [{name: 平均回收率, points: [72, 45, 28, 11]}]
      source: 示意数据，仅用于说明清偿顺序的影响
    - type: case
      label: 微案例
      title: 同一发行人不同层级的差别
      nums: [{label: 违约概率, v: 15%}, {label: 有抵押回收率, v: 70%}, {label: 次级回收率, v: 15%}]
      body: 同一个发行人，两笔债的预期损失差了近 4 倍。分级不是为了区分"会不会违约"，而是"违约后能拿回多少"。
  links:
    - {to: finance.bond.credit-spread, reason: 前置：利差里定价了什么}
    - {to: econ.micro.opportunity-cost, reason: 延伸：风险补偿也是一种机会成本}

