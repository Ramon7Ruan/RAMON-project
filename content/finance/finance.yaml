# 差异化约束：本区每个概念必须包含 formula / calc / dataviz（可计算、可比、可查）

# ============================== 股票 ==============================

- id: finance.equity.pe-ratio
  domain: finance
  track: equity
  title: 市盈率
  one_liner: 20 倍市盈率，到底算贵还是便宜？
  key_points:
    - 市盈率等于股价除以每股收益，回答几年回本
    - 必须先确认盈利口径与周期位置
  difficulty: 1
  tags: [估值, 股票]
  order: 1
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, compare, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "市盈率 = 股价 / 每股收益。它回答的是**按当前盈利水平多少年赚回本金**。但脱离盈利的**质量与增速**看这个数字，几乎一定误判。"}
    - type: formula
      label: 常见衍生口径
      latex: PE_{TTM} = \frac{P}{EPS_{TTM}}
      note: 滚动市盈率用最近四个季度；静态用上一完整年度；预测用一致预期
      symbols:
        - {s: P, m: 当前股价}
        - {s: 'EPS_{TTM}', m: 最近四个季度每股收益}
    - type: dataviz
      label: 历史分位怎么读
      chart: bar
      xLabel: 估值区间
      yLabel: 出现频率
      xTicks: ["<10x", "10-15x", "15-20x", "20-25x", "25-30x", ">30x"]
      series: [{name: 历史分布, points: [6, 14, 23, 18, 11, 7]}]
      source: 示意数据，仅用于说明分位思路
    - {type: pitfall, label: 误区, wrong: 市盈率低于同行就等于便宜。, right: 要先确认盈利口径、周期位置与一次性损益是否可比。, why: 低估值有时是市场对盈利不可持续的正确定价。}
    - type: compare
      label: 为什么不通用
      columns: ["", 低市盈率, 高市盈率]
      rows:
        - [常见原因一, 盈利处于周期高点, 市场预期高增长]
        - [常见原因二, 行业前景黯淡, 盈利暂时被压低]
        - [判断要点, 盈利能否持续, 增速能否兑现]
  links:
    - {to: finance.equity.pb-ratio, reason: 对比：盈利为负时该看什么}
    - {to: econ.micro.market-structure, reason: 延伸：定价能力如何体现在估值上}
    - {to: finance.equity.dcf-valuation, reason: 对照：相对估值与绝对估值各自的适用边界}

- id: finance.equity.pb-ratio
  domain: finance
  track: equity
  title: 市净率
  one_liner: 盈利为负的公司，用什么估值？
  key_points:
    - 市净率等于市值除以净资产，适合重资产行业
    - 高市净率意味着市场认可净资产的盈利能力
  difficulty: 2
  tags: [估值, 股票]
  order: 2
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, compare, case]
  blocks:
    - {type: prose, label: 定义, body: "市净率 = 市值 / 净资产。它的好处是**分母比盈利稳定**，在亏损或周期底部仍可用；代价是它假设账面价值反映了真实价值。"}
    - type: formula
      label: 与净资产收益率的关系
      latex: PB = ROE \times PE
      note: 高 PB 只有在高 ROE 能持续时才合理
      symbols:
        - {s: PB, m: 市净率}
        - {s: ROE, m: 净资产收益率}
        - {s: PE, m: 市盈率}
    - type: compare
      label: 两个估值指标怎么选
      columns: ["", 市盈率, 市净率]
      rows:
        - [分母稳定性, 波动大，可能为负, 相对稳定]
        - [适用行业, 轻资产、盈利稳定, 银行、地产、重资产]
        - [失效场景, 亏损或周期底部, 资产质量不实]
    - type: dataviz
      label: 不同行业的市净率差异
      chart: bar
      xLabel: 行业
      yLabel: 市净率中位数
      xTicks: [银行, 地产, 制造, 消费, 软件]
      series: [{name: 市净率, points: [0.6, 0.9, 1.8, 3.4, 6.2]}]
      source: 示意数据，仅用于说明行业差异
    - type: case
      label: 微案例
      title: 银行为什么长期破净
      nums: [{label: 市净率, v: 0.6}, {label: 净资产收益率, v: 9%}]
      body: 市场担心的是资产质量——账面净资产里可能藏着未充分暴露的不良贷款。破净不是免费的午餐，而是对资产真实性的折价。
  links:
    - {to: finance.equity.pe-ratio, reason: 对比：盈利口径的另一面}
    - {to: finance.equity.roe-dupont, reason: 前置：净资产收益率由什么决定}

- id: finance.equity.dividend-yield
  domain: finance
  track: equity
  title: 股息率
  one_liner: 股息率 5%，比存款划算吗？
  key_points:
    - 股息率等于每股分红除以股价，是现金回报
    - 高股息要看分红能否持续，别只看当期
  difficulty: 1
  tags: [分红, 股票]
  order: 3
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "股息率 = 每股分红 / 股价。它是**真金白银的现金回报**，不像盈利那样容易被会计处理影响，但前提是分红能持续。"}
    - type: formula
      label: 股息率与派息率
      latex: DY = \frac{DPS}{P}, \quad Payout = \frac{DPS}{EPS}
      note: 股息率是给你的回报率，派息率是公司分掉多少利润
      symbols:
        - {s: DPS, m: 每股分红}
        - {s: P, m: 股价}
        - {s: Payout, m: 派息率}
    - type: dataviz
      label: 股息率与派息率的组合
      chart: bar
      xLabel: 组合类型
      yLabel: 数值
      xTicks: ["高股息+低派息", "高股息+高派息", "低股息+低派息", "低股息+高派息"]
      series: [{name: 股息率 %, points: [5.2, 6.8, 1.1, 0.6]}]
      source: 示意数据，仅用于说明组合差异
    - {type: pitfall, label: 误区, wrong: 股息率高就是好股票。, right: 派息率过高可能意味着公司没有更好的再投资机会，或是分红来自一次性收益。, why: 分红是否可持续，取决于现金流而不是分红率本身。}
    - type: case
      label: 微案例
      title: 高股息的两家公司
      nums: [{label: A 公司派息率, v: 45%}, {label: B 公司派息率, v: 110%}]
      body: A 用当年利润的一部分分红，可持续；B 分掉了超过全年利润，靠动用留存收益或举债维持，不可持续。
  links:
    - {to: finance.equity.buyback, reason: 对比：另一种把现金还给股东的方式}
    - {to: finance.equity.pe-ratio, reason: 延伸：估值与现金回报一起看}

- id: finance.equity.roe-dupont
  domain: finance
  track: equity
  title: ROE 与杜邦分解
  one_liner: 两家 ROE 都是 15%，为什么质量差很远？
  key_points:
    - ROE 拆成利润率、周转率、杠杆三块
    - 靠杠杆堆出来的 ROE 质量最差
  difficulty: 2
  tags: [财务, 股票]
  order: 4
  updated_at: 2026-09-21
  recipe: [prose, formula, compare, calc]
  blocks:
    - {type: prose, label: 定义, body: "杜邦分解把 ROE 拆成三块：**赚得厚不厚、转得快不快、借得多不多**。同样 15% 的 ROE，来源不同，可持续性完全不同。"}
    - type: formula
      label: 三因子分解
      latex: ROE = \frac{Net}{Sales} \times \frac{Sales}{Assets} \times \frac{Assets}{Equity}
      note: 依次是净利率、总资产周转率、权益乘数
      symbols:
        - {s: 净利率, m: 每 1 元收入赚多少}
        - {s: 周转率, m: 每 1 元资产产生多少收入}
        - {s: 权益乘数, m: 资产是净资产的几倍}
    - type: compare
      label: 三种 15% 的 ROE
      columns: ["", 高净利率型, 高周转型, 高杠杆型]
      rows:
        - [典型行业, 品牌消费, 零售与渠道, 银行与地产]
        - [可持续性, 取决于定价权, 取决于运营效率, 取决于融资环境]
        - [风险点, 品牌老化, 规模瓶颈, 利率与信用]
    - type: calc
      label: 迷你计算器 · 拖动即算
      calc: duration
      inputs:
        - {key: c, label: 票息率, min: 0, max: 12, step: 0.1, v: 3, unit: "%"}
        - {key: n, label: 剩余期限, min: 1, max: 30, step: 1, v: 10, unit: 年}
        - {key: y, label: 到期收益率, min: 0.5, max: 12, step: 0.1, v: 4, unit: "%"}
  links:
    - {to: finance.equity.pb-ratio, reason: 延伸：高 ROE 才支撑得起高市净率}
    - {to: finance.bond.credit-spread, reason: 延伸：高杠杆如何传导到融资成本}

- id: finance.equity.market-cap
  domain: finance
  track: equity
  title: 总市值与自由流通市值
  one_liner: 指数按哪个市值加权，结果差多少？
  key_points:
    - 总市值算全部股本，自由流通市值只算可交易部分
    - 加权口径决定了指数被谁主导
  difficulty: 2
  tags: [指数, 股票]
  order: 5
  updated_at: 2026-09-21
  recipe: [prose, formula, dataviz, compare, flow]
  blocks:
    - {type: prose, label: 定义, body: "总市值 = 股价 × 总股本；自由流通市值 = 股价 × **实际可自由交易的股本**。用哪个加权，直接决定指数里谁说了算。"}
    - type: formula
      label: 两种市值
      latex: MC_{total} = P \times Shares, \quad MC_{free} = P \times Shares_{free}
      note: 自由流通股本剔除了控股股东、战略投资者与限售部分
      symbols:
        - {s: Shares, m: 总股本}
        - {s: 'Shares_{free}', m: 自由流通股本}
    - type: compare
      label: 两种加权的差别
      columns: ["", 总市值加权, 自由流通市值加权]
      rows:
        - [谁占权重高, 大股东持股集中的公司, 实际可流通盘大的公司]
        - [换手影响, 调仓冲击成本高, 相对可控]
        - [常见使用者, 部分综合指数, 多数可投资指数]
    - type: dataviz
      label: 同一家公司两种口径的差异
      chart: bar
      xLabel: 口径
      yLabel: 市值 亿元
      xTicks: [总市值, 自由流通市值, 实际可交易]
      series: [{name: 市值, points: [3200, 1150, 980]}]
      source: 示意数据，仅用于说明口径差异
    - type: flow
      label: 指数是怎么编制出来的
      steps:
        - {label: 划定样本空间, note: 行业与流动性筛选}
        - {label: 确定加权方式, note: 总市值还是自由流通}
        - {label: 设置权重上限, note: 防止单一股票占比过高}
        - {label: 定期调整, note: 每季度或每半年}
  links:
    - {to: finance.fund.tracking-error, reason: 延伸：指数基金如何跟上加权口径}
    - {to: finance.equity.buyback, reason: 延伸：回购如何改变股本}
    - {to: hotspot.data.northbound-flow, reason: 延伸：被动资金的买卖由指数加权方式决定}

- id: finance.equity.buyback
  domain: finance
  track: equity
  title: 股份回购
  one_liner: 公司回购股份，到底是谁赚了？
  key_points:
    - 回购减少股本，同样的利润分给更少的股东
    - 只有在股价低于内在价值时回购才真正创造价值
  difficulty: 2
  tags: [回购, 股东回报]
  order: 6
  updated_at: 2026-09-21
  recipe: [prose, formula, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "回购是公司用现金买回自己的股份并注销。它和分红一样是**把现金还给股东**，区别在于分红是直接给钱，回购是**减少股份数**、推高每股指标。"}
    - type: formula
      label: 回购对每股收益的影响
      latex: EPS' = \frac{Net}{Shares - Repurchased}
      note: 分子不变、分母变小，EPS 机械上升
      symbols:
        - {s: Net, m: 净利润}
        - {s: Repurchased, m: 回购注销的股数}
    - type: case
      label: 微案例
      title: 高价回购的代价
      nums: [{label: 回购均价, v: 42 元}, {label: 内在价值估计, v: 28 元}]
      body: 用高于内在价值的价格回购，等于把留下的股东的钱转移给了卖出的股东。EPS 上去了，价值却下降了。
    - {type: pitfall, label: 误区, wrong: 回购公告就是利好。, right: 要同时看回购价格、资金来源与是否真的注销。, why: 借钱回购、高价回购、回购后用于股权激励而不注销，都不是对股东有利的回购。}
  links:
    - {to: finance.equity.dividend-yield, reason: 对比：另一种股东回报方式}
    - {to: finance.equity.market-cap, reason: 延伸：股本变化如何影响市值口径}

- id: finance.equity.dcf-valuation
  domain: finance
  track: equity
  title: 现金流折现
  one_liner: 一个估值模型，为什么能算出天差地别的结果？
  key_points:
    - 折现率与永续增长率各动 1%，结果差很多
    - 模型只反映假设，不产生答案
  difficulty: 3
  tags: [估值, 模型]
  order: 7
  updated_at: 2026-09-21
  recipe: [prose, formula, curve, scale]
  blocks:
    - {type: prose, label: 定义, body: "现金流折现把未来现金流按风险调整后的利率折回今天。**输入决定输出**——它不是一个能给出「真值」的模型，而是一个把假设显性化的工具。"}
    - type: formula
      label: 两阶段模型
      latex: V = \sum_{t=1}^{n} \frac{FCF_t}{(1+r)^t} + \frac{FCF_{n+1}}{(r - g)(1+r)^n}
      note: 永续增长项对结果影响极大，且要求 r 大于 g
      symbols:
        - {s: FCF_t, m: 第 t 年的自由现金流}
        - {s: r, m: 折现率，通常用加权平均资本成本}
        - {s: g, m: 永续增长率}
    - type: curve
      label: 折现率的敏感性
      xLabel: 折现率 r %
      yLabel: 估值倍数
      xDomain: [6, 16]
      yDomain: [0, 30]
      note: 折现率从 8% 升到 12%，估值可能腰斩。
      series:
        - {name: 估值倍数, points: [[6, 26], [8, 18.5], [10, 13.5], [12, 10.2], [14, 7.8], [16, 6]]}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "±1 个点", t: "r 或 g 微调\n估值变动 10-20%"}
        - {v: "±2 个点", t: "常用敏感性区间\n结果可能差一倍"}
        - {v: "假设失真", t: "模型再精细也没用"}
  links:
    - {to: finance.equity.roe-dupont, reason: 前置：盈利能力从哪来}
    - {to: finance.bond.duration, reason: 类比：久期也是对未来现金流的加权}

# ============================== 债券 ==============================

- id: finance.bond.duration
  domain: finance
  track: bond
  title: 久期
  one_liner: 利率变动 1%，债券价格会变动多少？
  key_points:
    - 修正久期 7 年约等于利率涨 1% 价格跌 7%
    - 票息越低、期限越长，久期越大
  difficulty: 2
  tags: [债券, 利率风险]
  order: 8
  updated_at: 2026-09-21
  recipe: [prose, formula, scale, calc]
  blocks:
    - {type: prose, label: 定义, body: "久期是债券价格对利率**敏感度的加权平均到期时间**。修正久期 7 年，意味着利率上升 1%，价格大约下跌 7%。"}
    - type: formula
      label: 修正久期
      latex: D_{mod} = \frac{D_{mac}}{1 + y}
      note: 价格变动近似：ΔP/P 约等于 负的修正久期乘以 Δy
      symbols:
        - {s: 'D_{mod}', m: 修正久期，单位年}
        - {s: 'D_{mac}', m: 麦考利久期}
        - {s: y, m: 到期收益率}
    - type: calc
      label: 迷你计算器 · 拖动即算
      calc: duration
      inputs:
        - {key: c, label: 票息率, min: 0, max: 12, step: 0.1, v: 3, unit: "%"}
        - {key: n, label: 剩余期限, min: 1, max: 30, step: 1, v: 10, unit: 年}
        - {key: y, label: 到期收益率, min: 0.5, max: 12, step: 0.1, v: 4, unit: "%"}
    - type: scale
      label: 数量级锚定
      ticks:
        - {v: "1 年", t: "短债\n利率风险很小"}
        - {v: "7 年", t: "中久期\n利率 +1% 价格约 -7%"}
        - {v: "25 年", t: "长债\n利率 +1% 价格约 -24%"}
  links:
    - {to: finance.bond.convexity, reason: 延伸：久期是线性近似，凸性修正它}
    - {to: finance.bond.yield-curve, reason: 延伸：整条曲线的形状由什么决定}
    - {to: hotspot.event.svb-collapse, reason: 案例：久期错配遇上利率快速上行的极端后果}

- id: finance.bond.yield-curve
  domain: finance
  track: bond
  title: 收益率曲线
  one_liner: 短端利率降了，长端为什么不动？
  key_points:
    - 短端由政策决定，长端由增长与通胀预期决定
    - 倒挂领先衰退，但不是必然
  difficulty: 2
  tags: [债券, 利率, 曲线]
  order: 9
  updated_at: 2026-09-21
  recipe: [prose, dataviz, compare, case]
  blocks:
    - {type: prose, label: 定义, body: "收益率曲线把**不同期限**的国债收益率连成一条线。它的形状反映市场对未来的预期，也决定了银行与保险这类机构的盈利空间。"}
    - type: dataviz
      label: 三种典型形态
      chart: line
      xLabel: 剩余期限
      yLabel: 到期收益率 %
      xTicks: ["3M", "1Y", "3Y", "5Y", "10Y", "30Y"]
      series:
        - {name: 常态陡峭, points: [1.8, 2, 2.3, 2.6, 3, 3.3]}
        - {name: 平坦, points: [2.6, 2.65, 2.7, 2.72, 2.75, 2.8]}
        - {name: 倒挂, points: [4.6, 4.4, 4, 3.7, 3.5, 3.6]}
      source: 示意数据，仅用于说明形态差异
    - type: compare
      label: 形态对应的含义
      columns: ["", 陡峭, 平坦或倒挂]
      rows:
        - [市场预期, 增长与通胀回升, 增长走弱或即将降息]
        - [银行息差, 扩大，利好放贷, 收窄，压制放贷意愿]
        - [历史经验, 复苏早期常见, 衰退前常见信号]
    - type: case
      label: 微案例
      title: 倒挂不等于立刻衰退
      nums: [{label: 历史领先时间, v: 6 到 18 个月}, {label: 出现过假信号, v: 有}]
      body: 倒挂作为信号有较长领先期，且历史上出现过假信号。把它当作概率信息而不是结论更稳妥。
  links:
