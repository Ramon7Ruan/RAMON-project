- id: hotspot.data.credit-impulse
  domain: hotspot
  track: data
  title: 信用脉冲
  one_liner: 一个比社融更领先的指标，是怎么算的？
  key_points:
    - 信用脉冲看的是新增信贷的增速，而非存量
    - 它领先实体需求大约两到三个季度
  difficulty: 3
  tags: [信用, 领先指标]
  order: 18
  updated_at: 2026-09-17
  source: 人民银行信贷收支表与社融增量数据，截至 2026-09-17
  recipe: [prose, formula, dataviz, flow, timeline]
  blocks:
    - {type: prose, label: 定义, body: "信用脉冲衡量**新增信用占 GDP 比重的同比变化**。区别在于它关注**增量**——存量社融增速高，但如果增量在放缓，对需求的支撑其实在减弱。"}
    - type: formula
      label: 定义式
      latex: CI_t = \frac{NewCredit_t}{GDP_t} - \frac{NewCredit_{t-4}}{GDP_{t-4}}
      note: 用同比变化剔除季节性，得到信用的边际强度
      symbols:
        - {s: NewCredit_t, m: 当期新增信用}
        - {s: GDP_t, m: 当期名义 GDP}
    - type: dataviz
      label: 信用脉冲领先于实体需求
      chart: line
      xLabel: 季度
      xTicks: ["Q1", "Q2", "Q3", "Q4", "Q5", "Q6"]
      yLabel: 指数化
      series:
        - {name: 信用脉冲, points: [0.4, 1.8, 2.6, 1.9, 0.8, -0.2]}
        - {name: 实体需求（滞后两季）, points: [1.2, 1.5, 2.4, 2.8, 2.1, 1]}
      source: 示意数据，仅用于说明领先关系
    - type: flow
      label: 为什么它会领先
      steps:
        - {label: 信用先扩张, note: 资金先到企业手上}
        - {label: 投资与生产跟进, note: 需要几个季度}
        - {label: 收入与消费改善, note: 传导到终端}
        - {label: 数据体现, note: 此时脉冲已回落}
    - type: timeline
      label: 一个信用脉冲周期
      events:
        - {date: "第 1 到 2 季", title: 政策放松，脉冲见底回升, note: 信贷先行放量。}
        - {date: "第 3 到 5 季", title: 脉冲见顶, note: 实体需求开始感受到。, hot: true}
        - {date: "第 6 到 8 季", title: 实体数据见顶, note: 脉冲已回落一段。}
        - {date: "之后", title: 脉冲转负, note: 增长动能随之减弱。}
  links:
    - {to: hotspot.data.social-financing, reason: 前置：社融是它的原料}
    - {to: econ.macro.monetary-transmission, reason: 基础概念：信用如何传导到实体}
    - {to: hotspot.event.china-property-policy, reason: 案例：政策组合拳在信用脉冲上的体现}

- id: hotspot.data.inventory-cycle
  domain: hotspot
  track: data
  title: 库存周期
  one_liner: 库存还在增加，为什么说是好事？
  key_points:
    - 关键看库存是被动累积还是主动建立
    - 主动补库阶段利润弹性最大
  difficulty: 2
  tags: [库存, 周期]
  order: 19
  updated_at: 2026-09-18
  source: 工业企业产成品存货与营业收入月度数据，截至 2026-09-18
  recipe: [prose, formula, dataviz, compare, timeline]
  blocks:
    - {type: prose, label: 定义, body: "库存周期把需求与库存的组合分成四段。**库存上升可以是坏消息**（需求太弱导致被动累积），也可以是**好消息**（预期需求好转而主动补库存）。" }
    - type: compare
      label: 四个阶段
      columns: ["", 需求, 库存, 含义]
      rows:
        - [主动补库, 上升, 上升, 景气最好]
        - [被动补库, 下降, 上升, 需求转弱信号]
        - [主动去库, 下降, 下降, 压力释放中]
        - [被动去库, 上升, 下降, 复苏前夜]
    - type: dataviz
      label: 营收与库存的方向组合
      chart: line
      xLabel: 月份
      yLabel: 同比 %
      xTicks: ["1", "2", "3", "4", "5", "6"]
      series:
        - {name: 营业收入, points: [-1.2, 0.4, 2.1, 3.4, 3.8, 3.1]}
        - {name: 产成品存货, points: [4.6, 5.1, 5.8, 6.2, 5.4, 4.2]}
      source: 示意数据，仅用于说明两者的错位
    - type: formula
      label: 库存为什么会变
      latex: '\Delta \text{库存} = \text{生产} - \text{销售}'
      note: 库存上升只说明「生产大于销售」。销售在升是**主动补库**（看好需求），销售在降是**被动累积**（卖不动）。同一个正号，两种含义——所以库存必须和需求方向一起读。
      symbols:
        - {s: '\Delta \text{库存}', m: 产成品存货的变动}
        - {s: '\text{生产}', m: 当期产出}
        - {s: '\text{销售}', m: 当期需求（营收）}
    - type: timeline
      label: 一轮周期有多长、市场提前多久
      events:
        - {date: "3 到 4 年", title: 完整周期长度, note: 长度比幅度稳定得多，是判断位置的主要依据。}
        - {date: "持续 4 到 6 季", title: 主动补库阶段, note: 量价齐升，周期行业超额收益最集中的窗口。, hot: true}
        - {date: "领先 1 到 2 季", title: 补库确认早于盈利改善, note: 财报滞后，高频开工与价格数据更早见底。}
        - {date: "去库后期", title: 数据最差的时候开始布局, note: 市场会提前交易下一轮补库。}
  links:
    - {to: hotspot.data.pmi-reading, reason: 前置：景气指标的读法}
    - {to: econ.macro.gdp-three-ways, reason: 基础概念：存货投资是 GDP 的一部分}

- id: hotspot.data.valuation-percentile
  domain: hotspot
  track: data
  title: 估值分位
  one_liner: PE 处于历史 90% 分位，就一定贵吗？
  key_points:
    - 分位依赖历史区间，区间选错结论就错
    - 要结合盈利周期与利率环境一起看
  difficulty: 2
  tags: [估值, 数据]
  order: 20
  updated_at: 2026-09-19
  source: 主要指数估值与历史分位统计，截至 2026-09-19
  recipe: [prose, formula, dataviz, timeline, scale]
  blocks:
    - {type: prose, label: 定义, body: "估值分位把当前估值放进历史区间里排序。**问题在于区间的选择**——过去十年包含了一轮完整周期，还是只有一段趋势？不同区间会得出完全不同的结论。"}
    - type: dataviz
      label: 同一指数在不同区间下的分位
      chart: bar
      xLabel: 回溯区间
      yLabel: 当前估值分位 %
      xTicks: ["近 3 年", "近 5 年", "近 10 年", "全历史"]
      series: [{name: 分位, points: [88, 72, 54, 46]}]
      source: 示意数据，仅用于说明区间选择的影响
    - type: formula
      label: 分位是怎么算出来的
      latex: '\text{分位} = \frac{\#\{t \in T : PE_t \le PE_{now}\}}{\#\{t \in T\}}'
      note: 分子是区间 T 内估值不高于当前的天数，分母是区间总天数。**T 一换结果就变**，所以分位只是区间内的相对位置，不是结论。利率环境、盈利周期、行业结构变化都会让历史区间失去可比性。
      symbols:
        - {s: 'T', m: 你选择的历史区间}
        - {s: 'PE_t', m: 第 t 日的市盈率}
        - {s: 'PE_{now}', m: 当前市盈率}
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "低于 30%", t: "历史偏低\n先确认盈利没恶化"}
        - {v: "40-60%", t: "中枢附近\n信息量有限"}
        - {v: "高于 80%", t: "历史偏高\n需要增长兑现"}
    - type: timeline
      label: 高分位之后通常发生什么
      events:
        - {date: "进入高分位", title: 估值达到历史 80% 分位以上, note: 需要盈利持续兑现才能维持。}
        - {date: "兑现期", title: 盈利跟上则消化估值, note: 横盘等待，时间换空间。, hot: true}
        - {date: "证伪期", title: 盈利不及预期, note: 估值与盈利双杀。}
        - {date: "回落期", title: 分位回到中枢附近, note: 重新具备吸引力。}
  links:
    - {to: finance.equity.pe-ratio, reason: 基础概念：市盈率怎么读}
    - {to: hotspot.data.credit-impulse, reason: 延伸：估值背后的流动性与信用环境}
