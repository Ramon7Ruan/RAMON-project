- id: hotspot.event.fed-cut-2026
  domain: hotspot
  track: event
  title: 美联储降息与曲线重定价
  one_liner: 降息落地后，长端收益率为什么反而上行？
  key_points:
    - 降息是短端的事，长端由预期决定
    - 被读成「鹰派降息」时，长端反而上行
  difficulty: 2
  tags: [美联储, 利率]
  order: 1
  updated_at: 2026-09-20
  source: 美联储议息声明与点阵图，美国财政部收益率数据，截至 2026-09-20
  recipe: [prose, dataviz, compare, timeline]
  blocks:
    - {type: prose, label: 定义, body: "降息是**短端**的事，长端由增长与通胀预期决定。当市场把这次降息读成**经济比预期更有韧性**时，长端收益率反而会走高——这就是所谓的「鹰派降息」反应。"}
    - type: timeline
      label: 事件脉络
      events:
        - {date: "2026-08 中旬", title: 就业数据走弱, note: 市场隐含降息概率升至 80% 以上。}
        - {date: "2026-09-17", title: 议息会议降息 25bp, note: 点阵图显示年内可能再降一次。, hot: true}
        - {date: "2026-09-18", title: 长端收益率上行, note: 10 年期反而走高约 8bp。}
        - {date: "2026-09-20", title: 曲线陡峭化, note: 2s10s 利差走阔至年内高位。}
    - type: dataviz
      label: 会议前后曲线变化
      chart: line
      xLabel: 期限
      yLabel: 收益率 %
      xTicks: ["2Y", "5Y", "10Y", "30Y"]
      series:
        - {name: 会议前, points: [3.6, 3.7, 3.85, 4.05]}
        - {name: 会议后, points: [3.35, 3.65, 3.93, 4.25]}
      source: 示意数据，仅用于说明陡峭化方向
    - type: compare
      label: 两种市场解读
      columns: ["", 鸽派解读, 鹰派解读]
      rows:
        - [关注点, 降息这个动作本身, 经济韧性与通胀粘性]
        - [对长端, 收益率下行, 收益率上行]
        - [对风险资产, 普遍利好, 分化，价值强于成长]
  links:
    - {to: finance.bond.yield-curve, reason: 基础概念：曲线形态由什么决定}
    - {to: econ.macro.monetary-transmission, reason: 基础概念：降息如何传导到实体}

- id: hotspot.event.pboc-lpr-2026
  domain: hotspot
  track: event
  title: LPR 非对称下调
  one_liner: 为什么这次只降了 5 年期？
  key_points:
    - 1 年期锚企业贷款，5 年期以上锚房贷
    - 非对称下调是稳地产与保息差的取舍
  difficulty: 2
  tags: [LPR, 银行]
  order: 2
  updated_at: 2026-09-15
  source: 全国银行间同业拆借中心 LPR 公告，截至 2026-09-15
  recipe: [prose, timeline, pitfall, case]
  blocks:
    - {type: prose, label: 定义, body: "1 年期 LPR 主要锚定企业短期贷款，5 年期以上 LPR 锚定房贷。**非对称下调**意味着政策在「稳地产」与「保银行息差」之间做取舍。"}
    - type: timeline
      label: 政策脉络
      events:
        - {date: "2026-06", title: 1 年期 LPR 下调 10bp, note: 5 年期维持不变。}
        - {date: "2026-09", title: 5 年期以上单独下调 15bp, note: 指向房贷成本与地产需求。, hot: true}
        - {date: "2026-09 下旬", title: 商业银行净息差继续收窄, note: 负债端成本刚性是主要约束。}
    - type: case
      label: 微案例
      title: 为什么银行息差不配合
      nums: [{label: 净息差, v: 历史低位}, {label: 存款成本, v: 刚性强}]
      body: 资产端利率持续下行，但存款利率调整滞后。息差被压到低位后，银行放贷意愿成为新的传导瓶颈。
    - {type: pitfall, label: 误区, wrong: LPR 下调就等于实际贷款利率同步下降。, right: 还要看银行加点、信贷额度与企业是否有融资需求。, why: 报价利率是基准，实际成交取决于供需与风险定价。}
  links:
    - {to: econ.macro.monetary-transmission, reason: 基础概念：传导链条上的漏损点}
    - {to: finance.bond.yield-curve, reason: 关联：政策利率与长端定价}

- id: hotspot.event.svb-collapse
  domain: hotspot
  track: event
  title: 硅谷银行事件
  one_liner: 一家银行的亏损，为什么两天就变成挤兑？
  key_points:
    - 期限错配遇上快速加息，账面亏损变实际亏损
    - 社交媒体时代，挤兑以小时计而非以天计
  difficulty: 3
  tags: [银行, 流动性]
  order: 3
  updated_at: 2026-09-10
  source: 美国联邦存款保险公司处置公告与监管听证记录，截至 2026-09-10
  recipe: [prose, flow, timeline, pitfall]
  blocks:
    - {type: prose, label: 定义, body: "这家银行的资产大量配置在长久期债券上，负债却是随时可取的存款。**利率快速上行让债券浮亏**，一旦需要变现就变成实亏，而信息传播的速度又让存款在两天内流走。"}
    - type: timeline
      label: 事件脉络
      events:
        - {date: "2022-2023", title: 快速加息, note: 持有至到期的债券出现大额浮亏。}
        - {date: "2023-03-08", title: 宣布融资计划, note: 市场解读为流动性紧张。}
        - {date: "2023-03-09", title: 单日存款流出创纪录, note: 股价大幅下挫。, hot: true}
        - {date: "2023-03-10", title: 被监管接管, note: 从披露到倒闭不到 48 小时。}
    - type: flow
      label: 挤兑是怎么加速的
      steps:
        - {label: 浮亏被关注, note: 分析师与投资者讨论}
        - {label: 股价下跌, note: 存款人开始担心}
        - {label: 手机银行转账, note: 无需排队即可提款}
        - {label: 自我实现的挤兑, note: 越担心越早取钱}
    - {type: pitfall, label: 误区, wrong: 这只是个别银行的经营问题。, right: 同样的期限错配在加息周期里是普遍存在的结构性风险。, why: 关键在于负债端的稳定性，而不是资产端是否"有问题"。}
  links:
    - {to: finance.bond.duration, reason: 基础概念：久期决定浮亏幅度}
    - {to: finance.bond.repo, reason: 关联：流动性如何突然枯竭}

- id: hotspot.event.japan-ycc-exit
  domain: hotspot
  track: event
  title: 日本退出收益率曲线控制
  one_liner: 维持了多年的低利率，为什么必须退出？
  key_points:
    - 汇率与输入型通胀迫使政策转向
    - 退出过程比终点更关键，节奏决定冲击大小
  difficulty: 3
  tags: [日本, 货币政策]
  order: 4
  updated_at: 2026-09-12
  source: 日本银行政策声明与会议纪要，截至 2026-09-12
  recipe: [prose, dataviz, compare, timeline, case]
  blocks:
    - {type: prose, label: 定义, body: "收益率曲线控制是通过大量购债把长端利率压在目标区间。**当通胀与汇率压力持续累积**，维持这个区间的成本越来越高，退出就成了时间问题。"}
    - type: timeline
      label: 退出路径
      events:
        - {date: "2016", title: 引入收益率曲线控制, note: 把 10 年期利率锚在零附近。}
        - {date: "2024", title: 结束负利率, note: 首次加息，但购债仍在继续。}
        - {date: "2026 上半年", title: 逐步放宽长端容忍区间, note: 每次幅度都很小。, hot: true}
        - {date: "2026-09", title: 长端利率明显上移, note: 市场开始讨论正常化终点。}
    - type: compare
      label: 退出节奏的两种路径
      columns: ["", 渐进退出, 快速退出]
      rows:
        - [市场冲击, 相对可控, 可能引发全球再定价]
        - [政策可信度, 需要反复沟通, 一次性锚定预期]
        - [对日元的支持, 较弱且缓慢, 较强但风险高]
    - type: dataviz
      label: 长端利率与汇率的方向
      chart: line
      xLabel: 时间
      yLabel: 指数化水平
      xTicks: ["Q1", "Q2", "Q3", "Q4", "Q5", "Q6"]
      series:
        - {name: 10 年期利率, points: [100, 103, 106, 112, 118, 124]}
        - {name: 日元汇率（升值方向）, points: [100, 98, 99, 102, 104, 107]}
      source: 示意数据，仅用于说明两者的关系
    - type: case
      label: 微案例
      title: 每次放宽区间只有一点点
      nums: [{label: 单次调整幅度, v: 25bp 以内}, {label: 调整次数, v: 多次}]
      body: 幅度小、次数多，是为了避免一次性冲击全球债市。代价是市场会持续试探政策底线，形成反复波动。
  links:
    - {to: finance.bond.yield-curve, reason: 基础概念：长端利率由什么决定}
    - {to: econ.macro.exchange-rate-regime, reason: 基础概念：汇率与货币政策的关系}

- id: hotspot.event.evergrande-default
