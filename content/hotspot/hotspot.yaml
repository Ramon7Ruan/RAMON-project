- id: hotspot.data.northbound-flow
  domain: hotspot
  track: data
  title: 北向资金流向
  one_liner: 北向净流入，就能跟进吗？
  key_points:
    - 资金流向是结果，不是原因
    - 要区分配置型与交易型的差异
  difficulty: 2
  tags: [资金流, 股票]
  order: 17
  updated_at: 2026-09-13
  source: 交易所互联互通资金流向披露，截至 2026-09-13
  recipe: [prose, dataviz, timeline, pitfall, scale]
  blocks:
    - {type: prose, label: 定义, body: "互联互通机制的每日资金净流入是**事后统计**。它反映的是当天的交易结果，而交易可能同时对冲、调仓或被动跟随指数，不一定代表方向性看多。"}
    - type: dataviz
      label: 净流入与后续走势
      chart: bar
      xLabel: 单周净流入区间
      yLabel: 次月上涨概率 %
      xTicks: ["大幅流出", "小幅流出", "小幅流入", "大幅流入"]
      series: [{name: 上涨概率, points: [48, 51, 52, 50]}]
      source: 示意数据，仅用于说明相关性很弱
    - type: scale
      label: 数量级直觉
      ticks:
        - {v: "单日几十亿", t: "不到成交额的 1%\n噪声就来自这个量级"}
        - {v: "单周数百亿", t: "接近常态水平\n本身不构成信号"}
        - {v: "持仓数万亿", t: "存量远大于流量\n日度变化只是零头"}
    - {type: pitfall, label: 误区, wrong: 跟着北向资金买就能赚钱。, right: 它们在信息、期限与约束上都与你不同，且数据是滞后的。, why: 资金流向是交易结果，不是预测信号。}
    - type: timeline
      label: 一笔外资的三种动机
      events:
        - {date: "阶段一", title: 配置型建仓, note: 按指数权重分批买入，周期以年计。}
        - {date: "阶段二", title: 交易型博弈, note: 持有期以天计，进出频繁。, hot: true}
        - {date: "阶段三", title: 被动调仓, note: 指数调整带来的机械买入与卖出。}
