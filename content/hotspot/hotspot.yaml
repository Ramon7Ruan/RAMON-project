        - {date: "极端期", title: 创出历史高位, note: 新增买盘变少。, hot: true}
        - {date: "触发期", title: 出现利空消息, note: 缺少接盘，跌幅更大。}
        - {date: "解除期", title: 多头集中平仓, note: 价格快速回落。}
    - type: compare
      label: 两类参与者的区别
      columns: ["", 商业持仓, 非商业持仓]
      rows:
        - [身份, 生产商与消费商, 基金与投机资金]
        - [目的, 套期保值, 方向性交易]
        - [怎么用, 用于判断实货压力, 用于判断情绪与拥挤度]
    - type: flow
      label: 怎么把持仓读成信号
      steps:
        - {label: 看绝对水平, note: 当前净多头处于历史什么位置}
        - {label: 看变化速度, note: 一周内是否急剧堆积}
        - {label: 看价格配合, note: 增仓上涨还是增仓滞涨}
        - {label: 判断拥挤度, note: 极端时反而要警惕反向}
