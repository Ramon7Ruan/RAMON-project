  one_liner: 一家房企的债务，为什么能牵动整个产业链？
  key_points:
    - 预售制下，房企现金流依赖销售回款
    - 信用收缩会沿着供应链和预售房传导
  difficulty: 3
  tags: [地产, 信用]
  order: 5
  updated_at: 2026-09-08
  source: 企业公告与债券受托管理人披露，截至 2026-09-08
  recipe: [prose, flow, timeline, case]
  blocks:
    - {type: prose, label: 定义, body: "房企的现金流入主要依靠**销售回款与再融资**。一旦销售转弱、融资收紧，两头同时收缩，就形成了自我强化的流动性危机，并沿供应链与预售房传导出去。"}
    - type: timeline
      label: 事件脉络
      events:
        - {date: "2020-08", title: 融资管理规则出台, note: 有息负债增速受约束。}
        - {date: "2021 下半年", title: 销售转弱, note: 回款下降，部分项目停工。}
        - {date: "2021-12", title: 境外债实质性违约, note: 触发交叉违约条款。, hot: true}
        - {date: "2022 至今", title: 保交楼与债务重组并行, note: 处置周期以年计。}
    - type: flow
      label: 风险是怎么传导的
      steps:
        - {label: 房企现金流紧张, note: 销售与融资双收缩}
        - {label: 供应链账款拖欠, note: 建筑与材料商受累}
        - {label: 项目停工, note: 购房者信心进一步下降}
        - {label: 销售继续转弱, note: 形成负向循环}
    - type: case
      label: 微案例
      title: 为什么处置这么慢
      nums: [{label: 在建项目数量, v: 数百个}, {label: 涉及债权人, v: 境内外多层}]
      body: 资产是分布在不同城市的在建项目，变现需要逐个推进。债务结构又跨越银行、信托、供应商与购房者，清偿顺序谈判极其复杂。
