<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>Recall · 金融知识复习 App 交互原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#FAFAF8;--surface:#FFFFFF;--surface-2:#F2F1ED;--surface-3:#E9E8E2;
--text:#1F1E1C;--text-2:#6B6A65;--text-3:#9A9993;
--border:rgba(0,0,0,.10);--border-2:rgba(0,0,0,.20);
--brand:#2F6FB0;--brand-soft:rgba(47,111,176,.10);--brand-line:rgba(47,111,176,.30);
--ok:#4C8A3F;--ok-soft:rgba(76,138,63,.12);
--due:#C68A1E;--due-soft:rgba(198,138,30,.13);
--bad:#B4453F;--bad-soft:rgba(180,69,63,.10);
--up:#C0392B;--down:#2E7D32;
}
[data-theme="dark"]{
--bg:#1A1A18;--surface:#242422;--surface-2:#2E2E2B;--surface-3:#3A3A36;
--text:#EDEBE6;--text-2:#A5A39D;--text-3:#75736E;
--border:rgba(255,255,255,.12);--border-2:rgba(255,255,255,.24);
--brand:#6FA8DC;--brand-soft:rgba(111,168,220,.14);--brand-line:rgba(111,168,220,.36);
--ok:#8FBF73;--ok-soft:rgba(143,191,115,.14);
--due:#E0B050;--due-soft:rgba(224,176,80,.14);
--bad:#E0857F;--bad-soft:rgba(224,133,127,.13);
--up:#E0857F;--down:#86C07A;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}

.sidebar{width:208px;flex:0 0 208px;background:var(--surface-2);border-right:.5px solid var(--border);
display:flex;flex-direction:column;padding:16px 12px}
.brand{font-size:15px;font-weight:500;padding:4px 10px 16px;letter-spacing:.02em}
.brand span{color:var(--text-3);font-weight:400;font-size:12px;display:block;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-sep{height:1px;background:var(--border);margin:10px 10px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;
border-radius:8px;font-size:13.5px;color:var(--text-2);cursor:pointer;transition:background .12s}
.nav-item:hover{background:var(--surface-3)}
.nav-item.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.nav-item .cnt{font-size:11.5px;color:var(--text-3)}
.nav-item.on .cnt{color:var(--brand)}
.side-foot{margin-top:auto;padding:12px 10px 4px;display:flex;align-items:center;gap:10px;
border-top:.5px solid var(--border)}
.ring{width:34px;height:34px;flex:0 0 34px}
.side-foot .ft{font-size:11.5px;color:var(--text-3);line-height:1.4}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;
padding:0 32px;border-bottom:.5px solid var(--border);background:var(--surface)}
.crumb{font-size:12.5px;color:var(--text-3)}
.crumb b{color:var(--text-2);font-weight:400}
.badge{font-size:12px;color:var(--text-2);padding:4px 10px;border-radius:999px;
border:.5px solid var(--border);cursor:pointer;background:var(--surface-2);white-space:nowrap}
.badge:hover{border-color:var(--border-2)}
.badge.new{color:var(--due);background:var(--due-soft);border-color:transparent}
.badge i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--due);
margin-right:6px;vertical-align:1px}
.view{flex:1;overflow-y:auto;padding:32px 32px 80px}
.page{max-width:760px;margin:0 auto}
.page.wide{max-width:920px}

.page-title{font-size:22px;font-weight:500;line-height:1.3}
.page-sub{font-size:13px;color:var(--text-3);margin-top:4px}
.sec-h{font-size:13px;font-weight:500;color:var(--text-2);margin:28px 0 10px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:12px}
.pad{padding:16px 18px}

.hero{background:var(--surface);border:.5px solid var(--border);border-radius:12px;
padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
cursor:pointer;transition:border-color .15s}
.hero:hover{border-color:var(--brand-line)}
.hero .hl{font-size:13px;color:var(--text-2)}
.hero .hv{font-size:18px;font-weight:500;margin-top:3px}
.hero .hv em{font-style:normal;color:var(--brand)}
.hero .go{font-size:18px;color:var(--text-3)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.dcard{background:var(--surface);border:.5px solid var(--border);border-radius:12px;
padding:14px 16px;cursor:pointer;transition:border-color .15s}
.dcard:hover{border-color:var(--brand-line)}
.dcard .dt{font-size:14px;font-weight:500}
.dcard .dn{font-size:12px;color:var(--text-3);margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--brand)}
.dcard .dp{font-size:11.5px;color:var(--text-3);margin-top:6px}

.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;
border-bottom:.5px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.dot{font-size:13px;line-height:1.5;flex:0 0 14px;text-align:center}
.dot.unread{color:var(--text-3)}.dot.reading{color:var(--brand)}
.dot.known{color:var(--ok)}.dot.review{color:var(--due)}
.row .rt{flex:1;min-width:0}
.row .rt b{font-weight:400;font-size:14px;display:block}
.row .rt span{font-size:12.5px;color:var(--text-3);display:block;margin-top:2px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rdf{font-size:11.5px;color:var(--text-3);white-space:nowrap;padding-top:2px}

.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.chip{font-size:12px;padding:3px 11px;border-radius:999px;border:.5px solid var(--border);
color:var(--text-2);cursor:pointer;background:var(--surface)}
.chip:hover{border-color:var(--border-2)}
.chip.on{background:var(--brand-soft);color:var(--brand);border-color:transparent}

.acc{margin-top:10px;border:.5px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.acc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
cursor:pointer;background:var(--surface-2)}
.acc-head b{font-weight:500;font-size:13.5px}
.acc-head .n{font-size:12px;color:var(--text-3);font-weight:400;margin-left:8px}
.acc-head .ar{font-size:11px;color:var(--text-3)}
.acc-body{border-top:.5px solid var(--border);display:none}
.acc.open .acc-body{display:block}
.acc.open .ar{transform:rotate(90deg)}
.acc-body .row{border-bottom:.5px solid var(--border)}
.acc-body .row:last-child{border-bottom:none}

.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.c-title{font-size:22px;font-weight:500;line-height:1.3;margin-top:14px}
.c-oneliner{font-size:15px;color:var(--text-2);margin-top:6px;line-height:1.5}
.c-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);white-space:nowrap}
.c-meta .fav{cursor:pointer;font-size:15px}
.recipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;
padding-top:14px;border-top:.5px solid var(--border)}
.recipe .rl{font-size:11.5px;color:var(--text-3);margin-right:2px}
.rb{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.stale{font-size:11.5px;color:var(--due);background:var(--due-soft);padding:2px 9px;
border-radius:999px;display:inline-block;margin-top:8px}

.blk{margin-top:28px}
.blk-label{font-size:11.5px;color:var(--text-3);margin-bottom:9px;letter-spacing:.04em}
.prose{font-size:14px;line-height:1.75}
.prose strong{font-weight:500;color:var(--text);background:var(--brand-soft);
padding:0 3px;border-radius:3px}

.formula-box{background:var(--surface-2);border-radius:12px;padding:20px 18px;text-align:center}
.formula-box .fx{font-size:17px;font-family:"Times New Roman",Georgia,serif;
font-style:italic;letter-spacing:.01em}
.formula-box .fn{font-size:12px;color:var(--text-3);margin-top:8px;font-style:normal}
.symtab{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
.symtab div{font-size:12.5px;color:var(--text-2);padding:4px 0;border-bottom:.5px solid var(--border)}
.symtab b{font-weight:500;color:var(--text);font-family:"Times New Roman",serif;
font-style:italic;margin-right:8px}

.chart-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:12px;
padding:14px 12px 10px}
.chart-wrap svg{display:block;width:100%;height:auto}
.chart-src{font-size:11px;color:var(--text-3);text-align:right;margin-top:6px}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 6px}
.ctrl label{font-size:12px;color:var(--text-2);white-space:nowrap}
.ctrl input[type=range]{flex:1;accent-color:var(--brand)}
.ctrl .cv{font-size:12px;color:var(--brand);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

table.cmp{width:100%;border-collapse:collapse;font-size:13px;
background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
table.cmp th{background:var(--surface-2);text-align:left;font-weight:500;font-size:12.5px;
padding:9px 14px;color:var(--text-2);border-bottom:.5px solid var(--border)}
table.cmp td{padding:9px 14px;border-bottom:.5px solid var(--border);color:var(--text-2);vertical-align:top}
table.cmp td:first-child{color:var(--text);font-weight:500}
table.cmp tr:last-child td{border-bottom:none}

.flow-row{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow-step{flex:1;min-width:0;background:var(--surface);border:.5px solid var(--border);
border-radius:10px;padding:11px 12px;text-align:center}
.flow-step b{display:block;font-size:12.5px;font-weight:500;line-height:1.4}
.flow-step span{display:block;font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.4}
.flow-arrow{flex:0 0 26px;display:flex;align-items:center;justify-content:center;
color:var(--text-3);font-size:13px}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--border-2)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-24px;top:6px;width:11px;height:11px;border-radius:50%;
background:var(--surface);border:1.5px solid var(--brand)}
.tl-item.hot .tl-dot{border-color:var(--due);background:var(--due-soft)}
.tl-date{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.tl-body b{display:block;font-size:13.5px;font-weight:500;margin-top:1px}
.tl-body span{display:block;font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.6}

.pitfall{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf{border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.65}
.pf .pf-h{font-size:11.5px;margin-bottom:6px;letter-spacing:.03em}
.pf-wrong{background:var(--bad-soft)}
.pf-wrong .pf-h{color:var(--bad)}
.pf-right{background:var(--ok-soft)}
.pf-right .pf-h{color:var(--ok)}
.pf-why{margin-top:10px;font-size:12.5px;color:var(--text-2);
padding-left:11px;border-left:2px solid var(--border-2)}

.case-card{background:var(--surface);border:.5px solid var(--border);border-left:2.5px solid var(--brand);
border-radius:0 12px 12px 0;padding:14px 18px}
.case-card .ct{font-size:13.5px;font-weight:500}
.case-nums{display:flex;gap:26px;margin:10px 0 6px;flex-wrap:wrap}
.case-nums div{font-size:12px;color:var(--text-3)}
.case-nums b{display:block;font-size:17px;font-weight:500;color:var(--text);
font-variant-numeric:tabular-nums;line-height:1.3}
.case-card p{font-size:13px;color:var(--text-2);line-height:1.7}

.scale-row{display:flex;gap:2px;margin-top:4px}
.scale-tick{flex:1;background:var(--surface);border:.5px solid var(--border);
padding:12px 13px;text-align:center}
.scale-tick:first-child{border-radius:12px 0 0 12px}
.scale-tick:last-child{border-radius:0 12px 12px 0}
.scale-tick b{display:block;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.scale-tick span{display:block;font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.5}

.calc-form{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px 18px}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px}
.cf label{font-size:12px;color:var(--text-2);display:flex;justify-content:space-between}
.cf label b{font-weight:500;color:var(--brand);font-variant-numeric:tabular-nums}
.cf input[type=range]{width:100%;accent-color:var(--brand);margin-top:6px}
.calc-out{margin-top:16px;padding-top:14px;border-top:.5px solid var(--border);
display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.calc-out div{font-size:11.5px;color:var(--text-3)}
.calc-out b{display:block;font-size:19px;font-weight:500;color:var(--text);
font-variant-numeric:tabular-nums;line-height:1.35}

.links{margin-top:34px;padding-top:18px;border-top:.5px solid var(--border)}
.links .lh{font-size:12px;color:var(--text-3);margin-bottom:8px}
.lk{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer}
.lk:hover{background:var(--surface-2)}
.lk .la{color:var(--brand);font-size:12px;flex:0 0 auto}
.lk b{font-weight:400;font-size:13.5px}
.lk span{font-size:12px;color:var(--text-3)}

.action-bar{display:flex;gap:10px;margin-top:30px;padding-top:20px;border-top:.5px solid var(--border)}
.btn{flex:1;text-align:center;padding:10px 14px;border-radius:9px;font-size:13.5px;cursor:pointer;
border:.5px solid var(--border-2);background:var(--surface);color:var(--text);transition:background .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.btn.primary:hover{opacity:.9}
.btn.sm{flex:0 0 auto;padding:6px 16px;font-size:12.5px}

.rq-prog{height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-bottom:6px}
.rq-prog i{display:block;height:100%;background:var(--brand);transition:width .25s}
.rq-num{font-size:12px;color:var(--text-3);text-align:right;margin-bottom:48px}
.rq-card{text-align:center;padding:52px 24px}
.rq-card .rq-t{font-size:19px;font-weight:500}
.rq-card .rq-o{font-size:14px;color:var(--text-2);margin-top:10px;line-height:1.6}
.rq-hint{font-size:12px;color:var(--text-3);padding-bottom:64px;text-align:center}
.rq-full{max-height:46vh;overflow-y:auto;background:var(--surface);border:.5px solid var(--border);
border-radius:12px;padding:22px 26px;text-align:left}
.rq-full .page{max-width:none}
.rq-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rq-btn{padding:12px;border-radius:9px;text-align:center;cursor:pointer;font-size:13.5px;
border:.5px solid var(--border-2);background:var(--surface)}
.rq-btn:hover{background:var(--surface-2)}
.rq-btn.b0{border-color:var(--bad);color:var(--bad)}
.rq-btn.b1{border-color:var(--due);color:var(--due)}
.rq-btn.b2{border-color:var(--ok);color:var(--ok)}

.search-input{width:100%;padding:13px 16px;font-size:15px;border-radius:11px;
border:.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;outline:none}
.search-input:focus{border-color:var(--brand-line)}
.srch-grp{font-size:11.5px;color:var(--text-3);margin:20px 0 6px;letter-spacing:.04em}
mark{background:var(--due-soft);color:inherit;border-radius:2px;padding:0 2px}

.set-sec{font-size:12px;color:var(--text-3);margin:26px 0 8px;letter-spacing:.05em}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;
padding:13px 18px;border-bottom:.5px solid var(--border);background:var(--surface)}
.set-row:first-of-type{border-radius:12px 12px 0 0}
.set-row:last-of-type{border-radius:0 0 12px 12px;border-bottom:.5px solid var(--border)}
.set-box{border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.set-row .sl{font-size:13.5px}
.set-row .sd{font-size:12px;color:var(--text-3);margin-top:2px}
.set-row .sr{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.seg{display:flex;border:.5px solid var(--border);border-radius:8px;overflow:hidden}
.seg div{padding:5px 13px;font-size:12px;cursor:pointer;background:var(--surface)}
.seg div.on{background:var(--brand);color:#fff}
.upd-panel{margin-top:10px;padding:16px 18px;border-radius:12px;background:var(--surface);
border:.5px solid var(--border);font-size:13px}
.upd-panel .uh{font-weight:500;margin-bottom:8px}
.upd-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:4px 0}
.empty{text-align:center;padding:64px 20px;color:var(--text-3);font-size:13.5px}
.empty b{display:block;color:var(--text-2);font-weight:400;font-size:14px;margin-bottom:6px}
.kcards{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--bg)}
.kcard{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;
cursor:pointer;transition:border-color .15s}
.kcard:hover{border-color:var(--brand-line)}
.kc-head{display:flex;align-items:center;gap:9px}
.kc-head .dot{flex:0 0 14px}
.kc-title{font-size:14.5px;font-weight:500;flex:1;min-width:0}
.kc-diff{font-size:11px;color:var(--text-3);white-space:nowrap}
.kc-detail{font-size:11.5px;color:var(--brand);background:var(--brand-soft);padding:3px 10px;
border-radius:999px;white-space:nowrap}
.kc-one{font-size:12.5px;color:var(--text-2);margin-top:7px;line-height:1.55}
.kc-pts{list-style:none;margin-top:9px}
.kc-pts li{font-size:12.5px;line-height:1.65;padding-left:15px;position:relative}
.kc-pts li::before{content:"·";position:absolute;left:5px;color:var(--text-3);font-weight:500}
.kc-recipe{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.kc-recipe .rb{font-size:11px}
.kc-stale{font-size:11px;color:var(--due);margin-top:9px}
.backlink{font-size:12.5px;color:var(--brand);cursor:pointer;display:inline-block}
.backlink:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Recall<span>金融知识复习</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <svg class="ring" viewBox="0 0 36 36" id="ring"></svg>
      <div class="ft" id="ringTxt"></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="badge" id="badge" onclick="go({name:'settings'})">内容 v2026.09.21</div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>

<script>
const TRACKS=[
 {key:'macro',domain:'econ',label:'宏观经济'},
 {key:'micro',domain:'econ',label:'微观经济'},
 {key:'econometrics',domain:'econ',label:'计量经济'},
 {key:'equity',domain:'finance',label:'股票'},
 {key:'bond',domain:'finance',label:'债券'},
 {key:'fund',domain:'finance',label:'基金'},
 {key:'quant',domain:'finance',label:'量化'},
 {key:'event',domain:'hotspot',label:'事件解剖'},
 {key:'data',domain:'hotspot',label:'数据观察'}
];

function plot(series,xDomain,yDomain,xLabel,yLabel,opt){
 opt=opt||{};
 const W=640,H=250,L=52,R=16,T=16,B=40;
 const px=v=>L+(v-xDomain[0])/(xDomain[1]-xDomain[0])*(W-L-R);
 const py=v=>H-B-(v-yDomain[0])/(yDomain[1]-yDomain[0])*(H-T-B);
 let g='';
 for(let i=0;i<=4;i++){const yv=yDomain[0]+(yDomain[1]-yDomain[0])*i/4;const y=py(yv);
  g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--border)" stroke-width="0.5"/>'+
     '<text x="'+(L-9)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+yv.toFixed(yv<10?1:0)+'</text>'}
 for(let i=0;i<=4;i++){const xv=xDomain[0]+(xDomain[1]-xDomain[0])*i/4;const x=px(xv);
  g+='<text x="'+x+'" y="'+(H-B+17)+'" text-anchor="middle" font-size="10.5" fill="var(--text-3)">'+xv.toFixed(0)+'</text>'}
 g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--border-2)" stroke-width="0.8"/>'+
    '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--border-2)" stroke-width="0.8"/>';
 series.forEach(s=>{
  const d=s.points.map((p,i)=>(i?'L':'M')+px(p[0]).toFixed(1)+' '+py(p[1]).toFixed(1)).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="'+(s.color||'var(--brand)')+'" stroke-width="2"'+
     (s.dash?' stroke-dasharray="'+s.dash+' 4"':'')+' stroke-linecap="round"/>';
  if(opt.dots)s.points.forEach(p=>{g+='<circle cx="'+px(p[0])+'" cy="'+py(p[1])+'" r="2.6" fill="'+(s.color||'var(--brand)')+'"/>'});
 });
 if(opt.legend!==false){
  let lx=L;
  series.forEach(s=>{g+='<line x1="'+lx+'" y1="'+(T+2)+'" x2="'+(lx+16)+'" y2="'+(T+2)+'" stroke="'+(s.color||'var(--brand)')+'" stroke-width="2"'+(s.dash?' stroke-dasharray="'+s.dash+' 4"':'')+'/>'+
   '<text x="'+(lx+21)+'" y="'+(T+6)+'" font-size="10.5" fill="var(--text-3)">'+esc(s.name)+'</text>';lx+=Math.min(150,26+s.name.length*11)});
 }
 g+='<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+esc(xLabel)+'</text>';
 g+='<text x="8" y="'+(T-5)+'" font-size="10.5" fill="var(--text-3)">'+esc(yLabel)+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';
}
function barchart(b){
 const W=640,H=230,L=44,R=14,T=18,B=38;
 const max=Math.max(...b.series.flatMap(s=>s.points))*1.18;
 const n=b.series[0].points.length, gw=(W-L-R)/n, bw=Math.min(30,gw/(b.series.length+1.2));
 const py=v=>H-B-v/max*(H-T-B);
 const pal=['var(--brand)','var(--due)','var(--ok)','var(--bad)'];
 let g='';
 for(let i=0;i<=3;i++){const y=py(max*i/3);g+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="var(--border)" stroke-width="0.5"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+(max*i/3).toFixed(max<2?2:0)+'</text>'}
 b.series.forEach((s,si)=>s.points.forEach((v,i)=>{
  const x=L+gw*i+(gw-bw*(b.series.length))/2+bw*si, y=py(v);
  g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-B-y).toFixed(1)+'" rx="2.5" fill="'+pal[si%4]+'"/>';
 }));
 (b.xTicks||[]).forEach((t,i)=>{g+='<text x="'+(L+gw*(i+.5)).toFixed(1)+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="10.5" fill="var(--text-3)">'+esc(t)+'</text>'});
 g+='<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-R)+'" y2="'+(H-B)+'" stroke="var(--border-2)" stroke-width="0.8"/>';
 if(b.series.length>1){let lx=L;b.series.forEach((s,si)=>{g+='<rect x="'+lx+'" y="'+(T-10)+'" width="9" height="9" rx="2" fill="'+pal[si%4]+'"/><text x="'+(lx+14)+'" y="'+(T-2)+'" font-size="10.5" fill="var(--text-3)">'+esc(s.name)+'</text>';lx+=Math.min(190,26+s.name.length*12)})}
 g+='<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="var(--text-3)">'+esc(b.xLabel||'')+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}
function elasticitySeries(e){

function calc_duration(el,key){
 const g=id=>parseFloat(document.getElementById('lb_'+id).textContent);
 document.getElementById('lb_'+key).textContent=el.value+({c:'%',n:'年',y:'%'}[key]);
 const vals={c:g('c'),n:g('n'),y:g('y')};
 const r=vals.y/100,cp=vals.c/100;
 let price=0,dur=0;
 for(let t=1;t<=Math.round(vals.n);t++){const cf=100*cp+(t===Math.round(vals.n)?100:0);const pv=cf/Math.pow(1+r,t);price+=pv;dur+=t*pv}

 document.getElementById('calcout').innerHTML=
  '<div>债券价格<b>'+price.toFixed(2)+'</b></div>'+
  '<div>麦考利久期<b>'+mac.toFixed(2)+' 年</b></div>'+
  '<div>修正久期<b>'+mod.toFixed(2)+' 年</b></div>'+
  '<div style="grid-column:1/-1;color:var(--text-2)">利率上升 1% → 价格约变动 <b style="display:inline;font-size:13px;color:var(--up)">'+
  (-mod).toFixed(2)+'%</b>（实际因凸性会略小）</div>';
}

   const a=inDomain(k),kn=a.filter(c=>S.progress[c.id]==='known').length;
   return '<div class="dcard" onclick=\'go({name:"domain",domain:"'+k+'"})\'><div class="dt">'+DOMAINS[k]+'</div>'+
   '<div class="dn">'+a.length+' 个概念 · 已掌握 '+kn+'</div><div class="bar"><i style="width:'+pct(k)+'%"></i></div>'+
   '<div class="dp">'+pct(k)+'%</div></div>'}).join('')+'</div>'+
 '<div class="sec-h">最近读过</div>'+
 '<div class="card"><div class="rows">'+C.filter(c=>S.progress[c.id]!=='unread').slice(0,5).map(c=>rowHTML(c)).join('')+'</div></div>'+
 '</div>';
}
function rowHTML(c){
 const st=S.progress[c.id];
 return '<div class="row" onclick=\'go({name:"concept",id:"'+c.id+'"})\'>'+
 '<div class="dot '+st+'">'+DOT[st]+'</div>'+
 '<div class="rt"><b>'+esc(c.title)+'</b><span>'+esc(c.one)+'</span></div>'+
 '<div class="rdf">'+trackLabel(c.track)+' · 难度 '+c.diff+'</div></div>';
}
function srcDate(c){
 const m=c.source&&c.source.match(/截至\s*([\d-]+)/);
 return m?m[1]:'2026-09-20';
}
function kcardHTML(c){
 const st=S.progress[c.id];
 let h='<div class="kcard" onclick=\'go({name:"concept",id:"'+c.id+'"})\'>'+
  '<div class="kc-head"><span class="dot '+st+'">'+DOT[st]+'</span>'+
  '<span class="kc-title">'+esc(c.title)+'</span>'+
  '<span class="kc-diff">难度 '+c.diff+'</span>'+
  '<span class="kc-detail">详情 →</span></div>'+
  '<div class="kc-one">'+esc(c.one)+'</div>'+
  '<ul class="kc-pts">'+c.kp.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>'+
  '<div class="kc-recipe">'+c.recipe.map(r=>'<span class="rb">'+recipeName[r]+'</span>').join('')+'</div>';
 if(c.domain==='hotspot')h+='<div class="kc-stale">内容截至 '+esc(srcDate(c))+'</div>';
 return h+'</div>';
}
function pageDomain(d,track){
 let list=track?inTrack(d,track):inDomain(d);
 const all=inDomain(d);
 let h='<div class="page"><div class="page-title">'+DOMAINS[d]+(track?' · '+trackLabel(track):'')+'</div>'+
 '<div class="page-sub">'+all.length+' 个概念的要点速览 · 已掌握 '+all.filter(c=>S.progress[c.id]==='known').length+
 ' · 待复习 '+all.filter(c=>S.progress[c.id]==='review').length+'</div>';
 const groups=track?[{key:track}]:TRACKS.filter(t=>t.domain===d);
 let anyShown=false;
 groups.forEach(g=>{
  const items=list.filter(c=>c.track===g.key);
  if(!items.length)return; anyShown=true;
  const dueN=items.filter(c=>S.progress[c.id]==='review').length;
  h+='<div class="acc'+(S.open[d+'.'+g.key]?' open':'')+'"><div class="acc-head" onclick="toggleAcc(\''+d+'.'+g.key+'\')">'+
   '<div><b>'+trackLabel(g.key)+'</b><span class="n">'+items.length+' 个概念'+(dueN?' · '+dueN+' 个待复习':'')+'</span></div>'+
   '<div class="ar">▶</div></div><div class="acc-body"><div class="kcards">'+
   items.map(kcardHTML).join('')+'</div></div></div>';
 });
 if(!anyShown)h+='<div class="empty"><b>这个分区还没有内容</b>去设置页检查内容更新，或导入内容包<div style="margin-top:14px"><span class="btn sm" onclick="go({name:\'settings\'})">去设置页</span></div></div>';
 return h+'</div>';
}
function pageConcept(id){
 const c=byId(id);
 if(!c)return '<div class="page"><div class="empty"><b>这个概念已不在内容库中</b>'+
  '它可能已在最近一次内容更新中被移除<div style="margin-top:14px"><span class="btn sm" onclick="go({name:\'home\'})">返回首页</span></div></div></div>';
 const st=S.progress[c.id];
 let h='<div class="page"><div style="margin-bottom:14px">'+
  '<span class="backlink" onclick=\'go({name:"domain",domain:"'+c.domain+'"})\'>← 返回'+DOMAINS[c.domain]+'要点速览</span></div>'+
  '<div class="c-head"><div class="crumb" style="padding-top:2px">'+
  '<span style="cursor:pointer;color:var(--brand)" onclick=\'go({name:"domain",domain:"'+c.domain+'"})\'>'+DOMAINS[c.domain]+'</span>'+
  ' / '+trackLabel(c.track)+'</div><div class="c-meta">'+
  '<span class="dot '+st+'" style="flex:none">'+DOT[st]+'</span><span>'+STATE_LABEL[st]+'</span>'+
  '<span class="fav" onclick="toggleFav(\''+c.id+'\')">'+(S.fav[c.id]?'★':'☆')+'</span></div></div>'+
  '<div class="c-title">'+esc(c.title)+'</div><div class="c-oneliner">'+esc(c.one)+'</div>';
 if(c.domain==='hotspot')h+='<div class="stale">内容截至 '+esc(srcDate(c))+'</div>';
 h+='<div class="recipe"><span class="rl">本页讲解方式</span>'+
  c.recipe.map(r=>'<span class="rb">'+recipeName[r]+'</span>').join('')+'</div>';
 h+=conceptBody(c);
 h+='<div class="links"><div class="lh">相关概念</div>'+
  c.links.map(l=>{const t=byId(l.to);return '<div class="lk" onclick=\'go({name:"concept",id:"'+l.to+'"})\'><span class="la">→</span><b>'+(t?esc(t.title):l.to)+'</b><span>'+esc(l.reason)+'</span></div>'}).join('')+'</div>';
 const nxt=inDomain(c.domain)[(inDomain(c.domain).findIndex(x=>x.id===c.id)+1)%inDomain(c.domain).length];
 h+='<div class="action-bar"><span class="btn" onclick="setState(\''+c.id+'\',\'fuzzy\')">标记不懂</span>'+
  '<span class="btn" onclick="setState(\''+c.id+'\',\'review\')">加入待复习</span>'+
  '<span class="btn primary" onclick="setState(\''+c.id+'\',\'known\')">我掌握了</span></div>'+
  '<div style="margin-top:14px;text-align:center"><span class="btn sm" onclick=\'go({name:"concept",id:"'+nxt.id+'"})\'>下一个：'+esc(nxt.title)+' →</span></div>';
 return h+'</div>';
}
function pageReview(){
 if(!S.rq.queue.length)return '<div class="page"><div class="empty"><b>复习队列是空的</b>'+
  '去各分区把概念标记为「加入待复习」，它们会出现在这里<div style="margin-top:16px">'+
  '<span class="btn sm" onclick="go({name:\'home\'})">返回首页</span></div></div></div>';
 if(S.rq.idx>=S.rq.queue.length){
  return '<div class="page"><div class="rq-card"><div class="rq-t">今天复习完了</div>'+
  '<div class="rq-o">本轮完成 '+S.rq.done+' 个概念<br>明天预计有 '+(dueList().length)+' 个到期</div>'+
  '<div style="margin-top:28px"><span class="btn sm" onclick="endReview()">返回首页</span></div></div></div>';
 }
 const c=byId(S.rq.queue[S.rq.idx]);
 const total=S.rq.queue.length,p=(S.rq.idx)/total*100;
 let h='<div class="page"><div class="rq-prog"><i style="width:'+p+'%"></i></div>'+
  '<div class="rq-num">'+(S.rq.idx+1)+' / '+total+'</div>';
 if(!S.rq.revealed){
  h+='<div class="rq-card"><div class="rq-t">'+esc(c.title)+'</div>'+
   '<div class="rq-o">'+esc(c.one)+'</div></div>'+
   '<div class="rq-hint">想一下再看解析</div>'+
   '<div style="text-align:center"><span class="btn sm" onclick="reveal()">展开解析（空格）</span></div>';
 }else{
  h+='<div class="rq-full"><div style="font-size:17px;font-weight:500">'+esc(c.title)+'</div>'+
   '<div class="c-oneliner" style="margin-bottom:4px">'+esc(c.one)+'</div>'+
   '<div class="recipe" style="margin-top:10px;padding-top:10px">'+c.recipe.map(r=>'<span class="rb">'+recipeName[r]+'</span>').join('')+'</div>'+
   conceptBody(c)+'</div>'+
   '<div class="rq-rate">'+
   '<div class="rq-btn b0" onclick="rate(0)">忘了<span style="display:block;font-size:11px;opacity:.7">1</span></div>'+
   '<div class="rq-btn b1" onclick="rate(1)">模糊<span style="display:block;font-size:11px;opacity:.7">2</span></div>'+
   '<div class="rq-btn b2" onclick="rate(2)">记得<span style="display:block;font-size:11px;opacity:.7">3</span></div></div>';
 }
 return h+'</div>';
}
function pageSearch(){
 const q=S.search.trim();
 let h='<div class="page"><div class="page-title">搜索</div>'+
 '<div style="margin-top:16px"><input class="search-input" placeholder="输入概念、标签或关键词…" value="'+esc(S.search)+'" '+
 'oninput="S.search=this.value;renderSearch()" id="sinput"></div>';
 if(!q){h+='<div class="sec-h">最近搜索</div><div class="filters">'+
  ['久期','弹性','通胀'].map(t=>'<div class="chip" onclick="S.search=\''+t+'\';renderSearch()">'+t+'</div>').join('')+'</div>';
  return h+'</div>'}
 const hits=C.filter(c=>(c.title+c.one+c.tags.join('')+JSON.stringify(c.blocks)).toLowerCase().includes(q.toLowerCase()));
 if(!hits.length)return h+'<div class="empty"><b>没有找到「'+esc(q)+'」</b>换个关键词，或去设置页检查内容更新</div></div>';
 let cur='';
 h+='<div style="margin-top:6px">';
 hits.forEach(c=>{
  const g=DOMAINS[c.domain]+' · '+trackLabel(c.track);
  if(g!==cur){cur=g;h+='<div class="srch-grp">'+g+'</div><div class="card"><div class="rows">'}
  const hl=s=>esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  h+='<div class="row" onclick=\'go({name:"concept",id:"'+c.id+'"})\'><div class="dot '+S.progress[c.id]+'">'+DOT[S.progress[c.id]]+'</div>'+
   '<div class="rt"><b>'+hl(c.title)+'</b><span>'+hl(c.one)+'</span></div></div>';
  const nx=hits[hits.indexOf(c)+1];
  if(!nx||DOMAINS[nx.domain]+' · '+trackLabel(nx.track)!==g)h+='</div></div>';
 });
 return h+'</div></div>';
}
function pageSettings(){
 let h='<div class="page"><div class="page-title">设置</div>';
 h+='<div class="set-sec">内容</div><div class="set-box">'+
  '<div class="set-row"><div><div class="sl">当前版本</div><div class="sd">v2026.09.21 · 经济学 6 · 金融学 5 · 热点 2</div></div></div>'+
  '<div class="set-row"><div><div class="sl">上次检查</div><div class="sd">今天 13:52</div></div><div class="sr">启动时自动检查已开启</div></div>'+
  '<div class="set-row"><div><div class="sl">检查更新</div><div class="sd">'+
   (S.upd==='idle'?'有新内容时会在这里提示':S.upd==='checking'?'正在检查…':S.upd==='found'?'发现新版本 v2026.09.28':'已是最新版本')+'</div></div>'+
   '<div class="sr">'+(S.upd==='checking'?'<span style="color:var(--text-3)">检查中…</span>':
    S.upd==='found'?'<span class="btn sm primary" onclick="S.upd=\'done\';render()">立即更新</span>':
    S.upd==='done'?'<span style="color:var(--ok)">已更新到 v2026.09.28</span>':
    '<span class="btn sm" onclick="S.upd=\'checking\';render();setTimeout(()=>{S.upd=\'found\';render()},1100)">立即检查</span>')+'</div></div>'+
  '<div class="set-row"><div><div class="sl">导入内容</div><div class="sd">选择本地的 concepts.jsonl，校验通过后替换内容库</div></div><div class="sr"><span class="btn sm">选择文件…</span></div></div>'+
  '</div>';
 if(S.upd==='found')h+='<div class="upd-panel"><div class="uh">v2026.09.28 可用</div>'+
  '<div class="upd-line"><span>发布日期</span><span>2026-09-28</span></div>'+
  '<div class="upd-line"><span>经济学</span><span>新增 2 · 修改 1</span></div>'+
  '<div class="upd-line"><span>金融学</span><span>新增 0 · 修改 3</span></div>'+
  '<div class="upd-line"><span>世界热点</span><span>新增 4 · 修改 2</span></div>'+
  '<div style="margin-top:12px;display:flex;gap:8px"><span class="btn sm primary" onclick="S.upd=\'done\';render()">立即更新</span>'+
  '<span class="btn sm" onclick="S.upd=\'idle\';render()">稍后</span></div>'+
  '<div style="margin-top:10px;font-size:11.5px;color:var(--text-3)">更新只替换内容库，你的复习进度不受影响。</div></div>';
 if(S.upd==='done')h+='<div class="upd-panel"><div class="uh" style="color:var(--ok)">已更新到 v2026.09.28</div>'+
  '<div style="font-size:12.5px;color:var(--text-2)">内容库已替换，复习进度已保留。热点区新增 4 条事件。</div></div>';
 h+='<div class="set-sec">数据</div><div class="set-box">'+
  '<div class="set-row"><div><div class="sl">导出我的数据</div><div class="sd">进度、收藏、笔记 · 不含内容库</div></div><div class="sr"><span class="btn sm">导出</span></div></div>'+
  '<div class="set-row"><div><div class="sl">导入我的数据</div><div class="sd">从备份文件恢复</div></div><div class="sr"><span class="btn sm">导入</span></div></div>'+
  '<div class="set-row"><div><div class="sl">重置复习进度</div><div class="sd">清空全部进度与复习记录，不可撤销</div></div><div class="sr"><span class="btn sm" style="color:var(--bad);border-color:var(--bad)" onclick="resetAll()">重置</span></div></div>'+
  '</div>';
 h+='<div class="set-sec">外观</div><div class="set-box"><div class="set-row"><div><div class="sl">主题</div></div>'+
  '<div class="sr"><div class="seg">'+['light','dark'].map(t=>'<div class="'+(S.theme===t?'on':'')+'" onclick="setTheme(\''+t+'\')">'+(t==='light'?'浅色':'深色')+'</div>').join('')+'</div></div></div></div>';
 h+='<div class="set-sec">关于</div><div class="set-box"><div class="set-row"><div><div class="sl">Recall v1.0</div>'+
  '<div class="sd">纯本地运行 · 内容可离线使用 · 这是一个交互原型，数据为演示用</div></div></div></div>';
 return h+'</div>';
}

/* ---------- actions ---------- */
function toggleAcc(k){S.open[k]=!S.open[k];render()}
function setState(id,st){S.progress[id]=st;render()}
function toggleFav(id){S.fav[id]=S.fav[id]?0:1;render()}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;render()}
function resetAll(){if(confirm('确定要清空全部复习进度吗？此操作不可撤销。')){C.forEach(c=>S.progress[c.id]='unread');render()}}
function startReview(){S.rq={queue:dueList().map(c=>c.id),idx:0,revealed:false,done:0};go({name:'review'})}
function reveal(){S.rq.revealed=true;render()}
function rate(n){S.progress[S.rq.queue[S.rq.idx]]=n===0?'review':n===1?'reading':'known';
 S.rq.done++;S.rq.idx++;S.rq.revealed=false;render()}
function endReview(){S.rq={queue:[],idx:0,revealed:false,done:0};go({name:'home'})}
function renderSearch(){const v=$('#view');v.innerHTML=pageSearch();const i=$('#sinput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}

function render(){
 renderNav();
 $('#crumb').innerHTML=crumbs();
 const b=$('#badge');
 b.className='badge'+(S.upd==='found'?' new':'');
 b.innerHTML=S.upd==='found'?'<i></i>内容有更新':'内容 v2026.09.21';
 const r=S.route;
 let html='';
 if(r.name==='home')html=pageHome();
 else if(r.name==='domain')html=pageDomain(r.domain,r.track);
 else if(r.name==='concept')html=pageConcept(r.id);
 else if(r.name==='review')html=pageReview();
 else if(r.name==='search')html=pageSearch();
 else if(r.name==='settings')html=pageSettings();
 $('#view').innerHTML=html;
 if(document.getElementById('calcout'))calc_duration({value:3},'c');
}
document.addEventListener('keydown',e=>{
 if(S.route.name==='review'&&S.rq.queue.length&&S.rq.idx<S.rq.queue.length){
  if(e.code==='Space'){e.preventDefault();if(!S.rq.revealed)reveal()}
  if(S.rq.revealed&&['1','2','3'].includes(e.key))rate(+e.key-1);
 }
});
render();
</script>
</body>
</html>
